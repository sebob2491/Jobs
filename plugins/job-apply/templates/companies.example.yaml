# Your own employer list for Find jobs and the Job Desk. Copy it to
# ~/.job-apply/companies.yaml (it stays on your computer) and edit it.
#
# lists: the plugin's employer lists to search. They update with the plugin.
#   semiconductor-az  semiconductor employers with Arizona sites (equipment makers, fabs);
#                     they hire HR, finance, IT and operations people too
#   phoenix-metro     large Phoenix-area employers: health care, education, finance,
#                     utilities, aerospace, retail, staffing firms
lists: [phoenix-metro, semiconductor-az]

# companies: employers of your own, in the same shape as the plugin's
# data/companies.yaml. A list's employer with the same name, or searching the same site,
# is left out for yours.
companies: []
# To add some, replace the line above with entries like this one:
# companies:
#   - name: Example Employer
#     careers_url: https://example.wd1.myworkdayjobs.com/Careers
#     ats: workday
#     confidence: medium
#     search: {workday: "https://example.wd1.myworkdayjobs.com/Careers"}
