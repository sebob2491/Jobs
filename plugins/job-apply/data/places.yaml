# Where the towns the plugin's employer lists cover are, for the Job Desk's "Within __ miles" (places.py): each
# town's centre as latitude and longitude, hand-entered from well-known public figures (to about a mile: the
# distance is a straight line between town centres, never a drive). Nothing is looked up on the internet.
#
# By state: `towns` (a name as job sites write it, any case: [latitude, longitude]) and `needs_state` (the towns read
# only with their state beside them: a name that is also a word, a company's or another place's, such as
# Enterprise, Anthem or the Las Vegas valley's Paradise).
# A town the lists name (their az_sites and nv_sites), and every town of search.STATE_CITIES and recommend._METROS,
# has an entry (tests/test_places.py checks it, and that each is inside its state).

