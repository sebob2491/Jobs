    az_sites: none listed (Oct 2026)
    confidence: high          # live check, Oct 2026: 29 openings, none in Arizona
    search: {workday: https://roberthalf.wd1.myworkdayjobs.com/RobertHalfCareers}
  - name: Allegis Group
    careers_url: https://careers-allegisgroup.icims.com/jobs/search?ss=1
    ats: icims                # allegisgroup.com/en/careers "Search Jobs" links here (corporate roles)
    az_sites: Tempe
    confidence: high          # live check, Oct 2026: openings listed with US-AZ-Tempe
    search: {icims: careers-allegisgroup}
  - name: TEKsystems
    careers_url: https://careers-teksystems.icims.com/jobs/search?ss=1
    ats: icims                # teksystems.com internal careers (Allegis Group) link here
    az_sites: Tempe
    confidence: high          # live check, Oct 2026: a Tempe opening listed with US-AZ-Tempe
    search: {icims: careers-teksystems}
  - name: Aerotek
    careers_url: https://careers-aerotek.icims.com/jobs/search?ss=1
    ats: icims                # aerotek.com internal careers (Allegis Group) link here
    az_sites: none seen in today's listings
    confidence: medium        # live check, Oct 2026: the iCIMS search works, but this portal shows each place
                              # under "Location" in the row's details, which the iCIMS reader doesn't pick up yet,
                              # so every result came back unplaced and unfiltered: no search block until it does
                              # (search: {icims: careers-aerotek})
  - name: Insight Global
    careers_url: https://careers.insightglobal.com/insightglobal-careers/
    ats: icims                # an iCIMS Jibe front end over the careers-insightglobal iCIMS portal
    az_sites: Phoenix area
    confidence: medium        # page seen; no search: the iCIMS portal redirects to the Jibe site, which answers the
