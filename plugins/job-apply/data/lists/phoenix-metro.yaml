# Large Phoenix-area employers across health care, education, government, finance,
# staffing, utilities, aerospace, tech and retail: the places that hire HR generalists,
# recruiters and other office roles in the Valley. A person's own ~/.job-apply/companies.yaml
# names this list (`lists: [phoenix-metro]`) to search it; see templates/companies.example.yaml.
# Same shape as data/companies.yaml. Each careers site and the system behind it was read off
# the live pages in Oct 2026, and every `search` block was run through the plugin's own search
# from a test machine and came back without an error. Employers with no `search` block run a
# system the plugin can't search (or turned automated reads away): Find jobs points the person
# to their careers page instead.

companies:
  - name: Banner Health
    careers_url: https://bannerhealth.wd108.myworkdayjobs.com/Careers
    ats: workday            # bannerhealth.com/careers links here (live check, Oct 2026)
    az_sites: Phoenix (HQ), Mesa, Scottsdale, Glendale, Gilbert, Chandler, Peoria, Sun City, Tempe
    confidence: high
    search: {workday: https://bannerhealth.wd108.myworkdayjobs.com/Careers}
  - name: HonorHealth
    careers_url: https://honorhealth.wd12.myworkdayjobs.com/HonorHealth_careers
    ats: workday            # honorhealth.com/careers links here (live check, Oct 2026)
    az_sites: Scottsdale, Phoenix, Tempe, Mesa, Peoria, Surprise
    confidence: high
    search: {workday: https://honorhealth.wd12.myworkdayjobs.com/HonorHealth_careers}
  - name: Dignity Health (CommonSpirit Health)
    careers_url: https://www.commonspirit.careers/
    ats: icims              # TalentBrew (Radancy) front end; Apply goes to the iCIMS portal careers-commonspirit
    az_sites: Phoenix (St. Joseph's), Chandler (Chandler Regional), Gilbert (Mercy Gilbert), Glendale (St. Joseph's Westgate)
    confidence: medium
    # No search block: the iCIMS portal's search answers with an AWS WAF captcha ("Human
    # Verification", HTTP 405), and the plugin's browser read of it found nothing even for
    # "nurse" (live check, Oct 2026). The careers page is searched in the browser instead.
  - name: Phoenix Children's
    careers_url: https://careers.phoenixchildrens.com/Positions/
    ats: company_site       # Phoenix Children's own ASP.NET job site with its own accounts; no ATS behind it seen
    az_sites: Phoenix (main campus), Glendale (Arrowhead), Mesa (East Valley), Avondale, Chandler, Gilbert, Peoria, Scottsdale, Tempe
    confidence: medium      # live check, Oct 2026: postings at /Positions/Posting/<id>, filters by Phoenix-area city
  - name: Mayo Clinic (Arizona)
    careers_url: https://jobs.mayoclinic.org/
    ats: oracle_hcm         # jobs.mayoclinic.org (TalentBrew) and careers.mayoclinic.org (Eightfold) front ends; Apply opens Oracle Recruiting site CX_1
    az_sites: Phoenix, Scottsdale
    confidence: high        # live check, Oct 2026: Phoenix openings came back from this search
    search: {oracle: {host: fa-euwp-saasfaprod1.fa.ocs.oraclecloud.com, site: CX_1}}
    # Also works: {eightfold: {host: careers.mayoclinic.org, domain: mc.org}}
  - name: Valleywise Health
    careers_url: https://jobs.valleywisehealth.org/
    ats: custom            # symplr; valleywisehealth.org/careers redirects here; Apply goes to apply.healthcaretalentsource.com (Symplr / HealthcareSource)
    az_sites: Phoenix (Medical Center, Roosevelt), Mesa, Chandler, Glendale, community health centers across the Valley
    confidence: medium
    # No search block: Symplr Recruit (HealthcareSource) isn't one of the plugin's search kinds.
  - name: Arizona State University
    careers_url: https://asu.wd1.myworkdayjobs.com/ASUStaffCareers
    ats: workday            # cfo.asu.edu/applicant links here for external staff applicants (live check, Oct 2026)
    az_sites: Tempe, Phoenix (Downtown), Mesa (Polytechnic), Glendale (West), Scottsdale (SkySong)
    confidence: high
    search: {workday: https://asu.wd1.myworkdayjobs.com/ASUStaffCareers}
  - name: Grand Canyon Education
    careers_url: https://gcu.wd1.myworkdayjobs.com/GCE
    ats: workday            # jobs.gce.com (www.gce.com/careers.html) links here (live check, Oct 2026)
    az_sites: Phoenix
    confidence: high
    search: {workday: https://gcu.wd1.myworkdayjobs.com/GCE}
  - name: Grand Canyon University
    careers_url: https://gcu.wd1.myworkdayjobs.com/GCU
    ats: workday            # gcu.edu/careers links here; same tenant as Grand Canyon Education (live check, Oct 2026)
    az_sites: Phoenix
    confidence: high
    search: {workday: https://gcu.wd1.myworkdayjobs.com/GCU}
  - name: Maricopa Community Colleges (MCCCD)   # not "Maricopa County Community College District": the plugin's name match would pull in Maricopa County's entry too
    careers_url: https://www.maricopa.edu/about/careers
    ats: unknown            # maricopa.edu answers with a Cloudflare challenge from here; reposted openings carry six-digit "Job ID"s (PeopleSoft-style), not confirmed
    az_sites: Tempe (district office), Phoenix, Mesa, Chandler, Gilbert, Glendale, Scottsdale, Avondale
    confidence: low         # careers page not seen (Cloudflare, Oct 2026)
  - name: City of Phoenix
    careers_url: https://www.phoenix.gov/administration/departments/hr/careers.html
    ats: custom            # peoplesoft; job search is PeopleSoft Talent Acquisition Manager: hcmprod.phoenix.gov/psc/hcmprodtam/EMPLOYEE/COP_TAM/c/HRS_HRAM_FL.HRS_CG_SEARCH_FL.GBL?FOCUS=Applicant
    az_sites: Phoenix
    confidence: high        # live check, Oct 2026
    # No search block: PeopleSoft isn't one of the plugin's search kinds.
  - name: Maricopa County
    careers_url: https://maricopa.wd1.myworkdayjobs.com/MC_External
    ats: workday            # maricopa.gov Human Resources page's "View Postings" links here (live check, Oct 2026)
    az_sites: Phoenix (downtown), Mesa, Tempe, county-wide
    confidence: high
    search: {workday: https://maricopa.wd1.myworkdayjobs.com/MC_External}
  - name: State of Arizona
    careers_url: https://www.azstatejobs.gov/jobs/search
    ats: custom            # pageup; azstatejobs.gov is a Clinch career site (state-of-arizona.career-pages.com); Apply goes to PageUp (secure.dc4.pageuppeople.com/apply/1045)
    az_sites: Phoenix (Capitol Mall), statewide
    confidence: high        # live check, Oct 2026
    # No search block: PageUp / Clinch aren't among the plugin's search kinds.
  # Phoenix-metro finance/insurance offices and staffing/HR-services firms (checked Oct 2026).
  - name: State Farm
    careers_url: https://jobs.statefarm.com/main/
    ats: icims                # jobs.statefarm.com is an iCIMS Jibe front end over the careers-statefarm iCIMS portal
    az_sites: Tempe (Marina Heights regional hub)
    confidence: medium        # page seen; no search: the iCIMS portal redirects to jobs.statefarm.com/jobs, which
                              # answers the headless browser with 403 (Oct 2026), and Jibe's own search isn't a supported kind
  - name: American Express
    careers_url: https://careers.americanexpress.com/en/sites/CX_1/jobs
    ats: oracle_hcm           # americanexpress.com/careers "Jobs" links here; the page names the egug.fa.us2 Oracle pod
    az_sites: Phoenix
    confidence: high          # live check, Oct 2026: Phoenix openings come back from the Oracle search
    search: {oracle: {host: egug.fa.us2.oraclecloud.com, site: CX_1}}
  - name: Wells Fargo
    careers_url: https://wf.wd1.myworkdayjobs.com/WellsFargoJobs
    ats: workday              # wellsfargojobs.com is the public front; it answered with a Cloudflare challenge (403) from here
    az_sites: Chandler, Phoenix, Tempe, Scottsdale, Mesa, Gilbert, Glendale
    confidence: high          # live check, Oct 2026: the Workday site lists ~1,700 openings, 66 in Arizona
    search: {workday: https://wf.wd1.myworkdayjobs.com/WellsFargoJobs}
  - name: Charles Schwab
    careers_url: https://www.schwabjobs.com/
    ats: icims                # schwabjobs.com is a Radancy (TalentBrew) front end; jobs live in the career-schwab iCIMS portal
    az_sites: Phoenix
    confidence: high          # live check, Oct 2026: the portal's search lists openings with US-AZ-Phoenix among their places
    search: {icims: career-schwab}
  - name: USAA
    careers_url: https://www.usaajobs.com/
    ats: workday              # usaajobs.com is a Radancy (TalentBrew) front end; it links to this Workday site
    az_sites: Phoenix (Phoenix Campus)
    confidence: high          # live check, Oct 2026: 70 openings at "Phoenix Campus (Main)"
    search: {workday: https://usaa.wd1.myworkdayjobs.com/USAAJOBSWD}
  - name: JPMorgan Chase
    careers_url: https://jpmc.fa.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CX_1001/requisitions
    ats: oracle_hcm           # jpmorganchase.com/careers links here
    az_sites: Tempe, Phoenix, Glendale, Chandler
    confidence: high          # live check, Oct 2026: Tempe and Phoenix openings come back from the Oracle search
    search: {oracle: {host: jpmc.fa.oraclecloud.com, site: CX_1001}}
  - name: Discover Financial (Capital One)
    careers_url: https://www.capitalonecareers.com/discover
    ats: workday              # Discover is part of Capital One; its careers page says all Discover roles are on
                              # Capital One's site (jobs.discover.com failed TLS verification from here)
    az_sites: Phoenix, Scottsdale
    confidence: high          # live check, Oct 2026
    search: {workday: https://capitalone.wd12.myworkdayjobs.com/Capital_One}
  - name: Vanguard
    careers_url: https://www.vanguardjobs.com/
    ats: workday              # vanguardjobs.com postings apply on this Workday site
    az_sites: Scottsdale, Chandler
    confidence: high          # live check, Oct 2026: 50 Scottsdale openings
    search: {workday: https://vanguard.wd5.myworkdayjobs.com/vanguard_external}
  - name: Northern Trust
    careers_url: https://ntrs.wd1.myworkdayjobs.com/northerntrust
    ats: workday              # careers.northerntrust.com redirects here
    az_sites: Tempe, Phoenix, Scottsdale
    confidence: high          # live check, Oct 2026: 62 Arizona openings, 52 in Tempe
    search: {workday: https://ntrs.wd1.myworkdayjobs.com/northerntrust}
  - name: ADP
    careers_url: https://jobs.adp.com/
    ats: unknown              # jobs.adp.com answered with a Cloudflare challenge (403) from here; system not seen
    az_sites: Tempe
    confidence: low
  - name: Robert Half
    careers_url: https://careers.roberthalf.com/global/en
    ats: workday              # careers.roberthalf.com is a Phenom front end; recruiting/branch roles apply on this Workday site
    az_sites: Phoenix, Chandler
    confidence: high          # live check, Oct 2026: Talent Manager (recruiter) openings in Phoenix and Chandler
    search: {workday: https://roberthalf.wd1.myworkdayjobs.com/RobertHalfStaffingCareers}
  - name: Robert Half (corporate roles)
    careers_url: https://careers.roberthalf.com/global/en
