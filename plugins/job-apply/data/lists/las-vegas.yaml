                              # with SuccessFactors behind them
    nv_sites: Las Vegas (The Venetian, The Palazzo, Venetian Expo)
    confidence: high          # live check, Oct 2026: Engineer II - Systems and Manager - Expo IT Services
    search: {phenom: {host: careers.venetianlasvegas.com, country: us, lang: en_us}}
  - name: Station Casinos (Red Rock Resorts)
    careers_url: https://ejfh.fa.us6.oraclecloud.com/hcmUI/CandidateExperience/en/sites/StationCasinos/
