# Las Vegas-area (Clark County, Nevada) employers that hire IT people: help desk and desktop support,
# systems and network administration, cloud, security and software. Casino resorts' corporate IT,
# gaming technology makers, data centers, the airline headquartered here, public agencies and
# schools, hospitals, IT staffing firms, and the federal contractors around Nellis AFB and the Nevada
# National Security Site. A person's own ~/.job-apply/companies.yaml names this list
# (`lists: [las-vegas]`) to search it; see templates/companies.example.yaml.
# Same shape as data/companies.yaml. Each careers site and the system behind it was read off the
# live pages in Oct 2026, and every `search` block was run through the plugin's own search from a
# test machine and came back without an error; each entry's comment names Las Vegas-area IT openings
# it found (or says there were none that day). Employers with no `search` block run a system the
# plugin can't search (or turned automated reads away), and say why (`no_search:`, which the live
# check reports): Find jobs points the person to their careers page instead. A bank, utility or hospital is here for its IT jobs in the valley, not its other work.

companies:
  # Casino resorts' corporate IT (checked Oct 2026).
  - name: MGM Resorts
    careers_url: https://careers.mgmresorts.com/
    ats: workday              # careers.mgmresorts.com's "Applicant login" opens this Workday site
    nv_sites: Las Vegas (corporate offices, the Strip resorts)
    confidence: high          # live check, Oct 2026: Sr Firewall Engineer and Sr IAM Engineer at its Las Vegas
                              # office, a Senior Network Engineer in Nevada
    search: {workday: https://mgmresorts.wd5.myworkdayjobs.com/MGMCareers}
  - name: Caesars Entertainment
    careers_url: https://www.caesars.com/careers
    ats: oracle_hcm           # caesars.com/careers links to this Oracle Recruiting site
    nv_sites: Las Vegas (corporate offices, the Strip resorts), Laughlin
    confidence: high          # live check, Oct 2026: Las Vegas corporate IT openings (Principal Cloud Security
                              # Architect, Lead Systems Analyst, IT Auditor, an IAM business analyst)
    search: {oracle: {host: edmn.fa.us2.oraclecloud.com, site: CX_1}}
  - name: Wynn Resorts
    careers_url: https://www.wynnresorts.com/careers/open-roles
    ats: smartrecruiters      # jobs.wynnresorts.com redirects to wynnresorts.com/careers; its "View All Positions"
                              # lists SmartRecruiters (WynnResorts) postings
    nv_sites: Las Vegas (Wynn, Encore)
    confidence: high          # live check, Oct 2026: Specialist - IT Support in Las Vegas
    search: {smartrecruiters: WynnResorts}
  - name: The Venetian Resort
    careers_url: https://careers.venetianlasvegas.com/
