# Semiconductor employers with Arizona (Phoenix / Chandler / Tempe) sites.
# Used by the find-jobs skill. `ats` is what the careers site was observed to use
# when this list was compiled (Oct 2026); the tools detect the real ATS from each
# page at run time, so a stale entry only costs a search, never a wrong form.
# confidence: how sure we are of careers_url + ats (high = seen on the live site).
# search: how search_company_jobs queries the site's public job-search API (see
# server/src/job_apply/search.py). Companies without one are searched in the browser.

companies:
  - name: ASML
    careers_url: https://www.asml.com/en/careers/find-your-job
    ats: unknown            # postings live on asml.com; its old SmartRecruiters board only lists stale roles
    az_sites: Chandler, Phoenix
    confidence: medium
  - name: Lam Research
    careers_url: https://careers.lamresearch.com/careers
    ats: eightfold
    az_sites: Chandler
    confidence: medium
    search: {eightfold: {host: careers.lamresearch.com, domain: lamresearch.com}}
  - name: Applied Materials
    careers_url: https://amat.wd1.myworkdayjobs.com/External
    ats: workday
    az_sites: Chandler, Tempe, Phoenix
    confidence: high
    search: {workday: https://amat.wd1.myworkdayjobs.com/External}
  - name: KLA
    careers_url: https://kla.wd1.myworkdayjobs.com/Search
