<!doctype html>
<html>
<head><meta charset="utf-8"><title>Embedded application</title></head>
<body>
<form>
  <label for="first_name">First Name *</label><input id="first_name" required>
  <label for="last_name">Last Name *</label><input id="last_name" required>
  <label for="email">Email *</label><input id="email" type="email" required>
  <div class="field"><div class="label">Cover Letter</div>
    <div class="upload"><label for="cover">Attach</label><input id="cover" type="file"></div></div>
  <div class="field"><div class="label">Resume/CV *</div>
    <div class="upload"><label for="res">Attach</label><input id="res" type="file" required></div></div>
  <button type="submit">Submit Application</button>
</form>
</body>
</html>
