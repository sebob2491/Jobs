<!doctype html>
<html>
<head><meta charset="utf-8"><title>Apply</title></head>
<body>
<!-- like Insight Enterprises' Eightfold form (live, Oct 2026): a quick run of fills loses some of
     them from the page's own record (each change is saved a moment later over the record as it
     stood, so one close behind another undoes it), and a box whose answer was lost is marked
     "cannot be left blank" while it still shows the answer -->
<h2>Contact Information</h2>
<form id="apply" novalidate>
  <label for="fn">First Name</label><input id="fn" name="First Name">
  <div class="field-error" id="fn-err" hidden></div>
  <label for="ln">Last Name</label><input id="ln" name="Last Name">
  <div class="field-error" id="ln-err" hidden></div>
  <label for="em">Email</label><input id="em" name="Email">
  <div class="field-error" id="em-err" hidden></div>
  <label for="ci">City</label><input id="ci" name="City">
  <div class="field-error" id="ci-err" hidden></div>
  <label for="zp">Postal Code</label><input id="zp" name="Postal Code">
  <div class="field-error" id="zp-err" hidden></div>
  <button type="submit">Next</button>
</form>
<script>
  window.record = {};
  const touched = new Set();
  function check() {
    for (const name of touched) {
      const el = document.querySelector(`[name="${name}"]`);
      const lost = !window.record[name];
      el.setAttribute('aria-invalid', lost ? 'true' : 'false');
      const err = document.getElementById(el.id + '-err');
      err.hidden = !lost;
      err.textContent = lost ? `Error: ${name} cannot be left blank.` : '';
    }
  }
  for (const el of document.querySelectorAll('input')) {
    el.addEventListener('input', () => {
      const stale = {...window.record};  // the record as it stood when the box changed
      const value = el.value;
      setTimeout(() => { window.record = {...stale, [el.name]: value}; touched.add(el.name); check(); }, 100);
    });
  }
</script>
</body>
</html>
