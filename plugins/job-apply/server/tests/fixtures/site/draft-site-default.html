<!doctype html>
<html>
<head><meta charset="utf-8"><title>Voluntary Disclosures</title></head>
<body>
<!-- A saved draft's step (issue #112, note 38's third review) with a list on its first choice and no empty one to start
     on: the desk answers such a list from the profile whatever it shows, which changes the draft's answer all the same -->
<div>current step 1 of 2</div>
<h2>Voluntary Disclosures</h2>
<form id="step" novalidate>
  <label for="fn">First Name *</label><input id="fn" required value="Sam">
  <label for="g">Gender</label>
  <select id="g"><option>Male</option><option>Female</option><option>Decline to self-identify</option></select>
  <button type="submit">Save and Continue</button>
</form>
<script>
  document.getElementById('step').addEventListener('submit', (e) => {
    e.preventDefault();
    location.href = 'review.html?' + new URLSearchParams([['g', document.getElementById('g').value]]);
  });
</script>
</body>
</html>
