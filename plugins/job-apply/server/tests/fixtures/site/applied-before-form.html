<!doctype html>
<html><head><meta charset="utf-8"><title>Submit application for Field Service Engineer</title></head>
<body>
<!-- An Eightfold-like one-page application for a job applied to before (issue #112, note 30): the form is still
     drawn, under the site's notice -->
<div role="alert" class="notice">You have already applied for this position.</div>
<h1>Application Form</h1>
<form id="app" method="post" action="/careers/apply/submit" novalidate>
  <label for="fn">First name *</label><input id="fn" name="fn" required>
  <label for="ln">Last name *</label><input id="ln" name="ln" required>
  <label for="em">Email *</label><input id="em" name="em" type="email" required>
  <button type="submit">Submit application</button>
</form>
</body></html>
