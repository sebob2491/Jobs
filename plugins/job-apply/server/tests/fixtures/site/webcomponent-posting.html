<!doctype html>
<html>
<head><meta charset="utf-8"><title>Field Service Engineer | Career Opportunities</title></head>
<body>
<!-- like Nikon Precision's UKG posting: Apply now is a <ukg-button> web component whose
     real button sits in its shadow root -->
<script>
  customElements.define('ukg-button', class extends HTMLElement {
    connectedCallback() {
      if (this.shadowRoot) return;
      this.attachShadow({ mode: 'open' }).innerHTML = '<button type="button"><slot></slot></button>';
    }
  });
</script>
<h1>Field Service Engineer</h1>
<p>Requisition Number: FIELD001451</p>
<ukg-button id="apply" data-tag-name="button" onclick="location.href = 'signin.html'">Apply now</ukg-button>
</body>
</html>
