<!doctype html>
<html>
<head><meta charset="utf-8"><title>Account verified</title></head>
<body>
<!-- The link in the email a Workday site sends a new account (live, Oct 2026), opened in another tab:
     it verifies the account for the site's records (workday-account.html?verify). localStorage stands
     in for them, shared by the browser's tabs over http (a file:// page has none). -->
<h2>Your account has been verified</h2>
<p>Sign in to go on with your application.</p>
<script>
  try { localStorage.setItem('wd.verified', 'yes'); } catch (e) { /* a file:// page */ }
</script>
</body>
</html>
