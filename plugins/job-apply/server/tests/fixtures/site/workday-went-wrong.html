<!doctype html>
<html>
<head><meta charset="utf-8"><title>Field Service Engineer</title></head>
<body>
<!-- like KLA's Workday right after its sign-in (live, Oct 2026): the application's first step shows
     "Something went wrong" and "Please refresh the page and then try again.", with an error code. A
     reload shows the application (step1.html). What happened is kept for the tab (sessionStorage's
     ww.loads). ?late: as KLA's in the nightly of Oct 12, the desk's one wait for late buttons used before it (an
     "Apply Manually" drawn late, which leads to "Something went wrong"), and the reloaded page drawing its
     application a few seconds late. ?again: as Circle K's Take Assessment step (run 63), the reloaded page says the same
     again. ?empty: as Northern Trust's (run 71), the reloaded page is only the site's header and footer, Workday's
     application frame between them empty (with &bare: not even the site's name as a heading); ?later: the reloaded page
     has a step whose Continue leads to such a page (the refresh worked: what's empty later isn't what it brought back,
     but a step still loading, as Grand Canyon University's, run 91). ?signin: the reloaded page is Workday's sign-in,
     which leads to workday-apply-unmounted.html's empty application frame (&heal: drawn after a reload). -->
<a href="#">Back to Job Posting</a>
<h2>Field Service Engineer</h2>
<div>current step 1 of 6 My Information</div>
<script>
  // (a reload counts as a later load even when sessionStorage lost the first load's count: on CI, under load, its
  // headless browser now and then drops a write a moment before a reload, and the page said the same again)
  const reloaded = (performance.getEntriesByType('navigation')[0] || {}).type === 'reload';
  const loads = Math.max(Number(sessionStorage.getItem('ww.loads') || 0) + 1, reloaded ? 2 : 1);
  sessionStorage.setItem('ww.loads', String(loads));
  const late = new URLSearchParams(location.search).has('late');
  const again = new URLSearchParams(location.search).has('again');
  const wrong = '<h2>Something went wrong</h2><p>Please refresh the page and then try again.</p>'
                + '<p>Error Code: VPS|0000</p>';
  const q = new URLSearchParams(location.search);
  const siteOnly = () => {
    document.title = 'Example Careers';
    document.body.innerHTML = '<header>' + (q.has('bare') ? '<p>Example Careers</p>' : '<h1>Example Careers</h1>')
      + '<a href="#">Search for Jobs</a> <a href="#">Candidate Home</a> <a href="#">Job Alerts</a></header>'
      + '<div id="mainContent" tabindex="-1" data-mfe-id="applyFlow"></div>'
      + '<footer><p>Follow Us</p><a href="#">Facebook</a> <a href="#">Candidate Privacy Notice</a>'
      + '<p>&copy; 2026 Workday, Inc. All rights reserved.</p></footer>';
  };
  if (loads > 1 && q.has('empty')) siteOnly();
  else if (loads > 1 && q.has('later')) {
    document.body.innerHTML = '<h2>My Information</h2><form onsubmit="return false"><label for="fn">First Name</label>'
      + '<input id="fn"><button type="button" id="go">Continue</button></form>';
    document.getElementById('go').addEventListener('click', siteOnly);
  } else if (loads > 1 && q.has('signin')) {
    document.body.innerHTML = '<h2>Sign In</h2><form id="signin" novalidate><label for="em">Email Address</label>'
      + '<input id="em" type="email" required><label for="pw">Password</label><input id="pw" type="password" required>'
      + '<button type="submit">Sign In</button></form>';
    document.getElementById('signin').addEventListener('submit', (e) => {
      e.preventDefault();
      if (document.getElementById('em').value && document.getElementById('pw').value)
        location.href = 'workday-apply-unmounted.html?apply' + (q.has('heal') ? '&heal' : '');
    });
  } else if (loads > 1 && !again) setTimeout(() => location.replace('step1.html'), late ? 3000 : 0);
  else if (late) setTimeout(() => {
    const b = document.createElement('button');
    b.textContent = 'Apply Manually';
    b.onclick = () => { b.remove(); document.body.insertAdjacentHTML('beforeend', wrong); };
    document.body.append(b);
  }, 1500);
  else document.write('<h2>Something went wrong</h2><p>Please refresh the page and then try again.</p>'
                      + '<p>Error Code: VPS|0000</p>');
</script>
</body>
</html>
