<!doctype html>
<html>
<head><meta charset="utf-8"><title>Field Service Engineer</title></head>
<body>
<!-- like KLA's Workday right after its sign-in (live, Oct 2026): the application's first step shows
     "Something went wrong" and "Please refresh the page and then try again.", with an error code. A
     reload shows the application (step1.html). What happened is kept for the tab (sessionStorage's
     ww.loads). ?late: as KLA's in the nightly of Oct 12, the desk's one wait for late buttons used before it (an
     "Apply Manually" drawn late, which leads to "Something went wrong"), and the reloaded page drawing its
     application a few seconds late. -->
<a href="#">Back to Job Posting</a>
<h2>Field Service Engineer</h2>
<div>current step 1 of 6 My Information</div>
<script>
  const loads = Number(sessionStorage.getItem('ww.loads') || 0) + 1;
  sessionStorage.setItem('ww.loads', String(loads));
  const late = new URLSearchParams(location.search).has('late');
  const wrong = '<h2>Something went wrong</h2><p>Please refresh the page and then try again.</p>'
                + '<p>Error Code: VPS|0000</p>';
  if (loads > 1) setTimeout(() => location.replace('step1.html'), late ? 3000 : 0);
  else if (late) setTimeout(() => {
    const b = document.createElement('button');
    b.textContent = 'Apply Manually';
    b.onclick = () => { b.remove(); document.body.insertAdjacentHTML('beforeend', wrong); };
    document.body.append(b);
  }, 1500);
  else document.write('<h2>Something went wrong</h2><p>Please refresh the page and then try again.</p>'
                      + '<p>Error Code: VPS|0000</p>');
</script>
</body>
</html>
