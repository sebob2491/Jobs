<!doctype html>
<html>
<head><meta charset="utf-8"><title>Apply for this job</title></head>
<body>
<h1>Apply for this job</h1>
<form id="app" novalidate>
  <label for="fn">First Name *</label><input id="fn" required>
  <label for="cv">Resume/CV *</label><input id="cv" type="file" required>
  <label for="nc">Do you have any agreement with your current employer (such as a non-compete or non-disclosure agreement)? *</label>
  <select id="nc" required><option value="">Select...</option><option>Yes</option><option>No</option></select>
  <button type="submit">Submit application</button>
</form>
</body>
</html>
