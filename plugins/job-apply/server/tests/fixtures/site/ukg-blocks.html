<!doctype html>
<html>
<head><meta charset="utf-8"><title>Apply</title></head>
<body>
<!-- like Desert Financial's UKG Pro (run 55, Oct 13): each work or education block is a form region its aria-label
     numbers ("Work Experience 2"), with no heading of its own; the section's Add is an icon button named "Add
     Experience" / "Add Education". Two jobs saved on the account are there as the page opens -->
<h2>Work Experience</h2>
<button type="button" aria-label="Add Experience" id="add-work">+</button>
<div id="work"></div>
<h2>Education</h2>
<button type="button" aria-label="Add Education" id="add-edu">+</button>
<div id="edu"></div>
<button type="button">Save and continue</button>
<script>
  function block(host, name, n, labels) {
    const div = document.createElement('div');
    div.setAttribute('role', 'form');
    div.setAttribute('aria-label', `${name} ${n}`);
    div.innerHTML = `<button type="button" aria-label="Delete ${name} ${n}">x</button>` + labels.map((l, i) =>
      `<label for="${host.id}-${n}-${i}">${l}</label><input id="${host.id}-${n}-${i}">`).join('');
    host.appendChild(div);
  }
  const work = document.getElementById('work'), edu = document.getElementById('edu');
  const jobs = () => work.querySelectorAll('[role=form]').length, schools = () => edu.querySelectorAll('[role=form]').length;
  block(work, 'Work Experience', 1, ['Job Title', 'Company / Organization']);
  block(work, 'Work Experience', 2, ['Job Title', 'Company / Organization']);
  document.getElementById('add-work').addEventListener('click', () => block(work, 'Work Experience', jobs() + 1, ['Job Title', 'Company / Organization']));
  document.getElementById('add-edu').addEventListener('click', () => block(edu, 'Education', schools() + 1, ['School', 'Level of Education / Degree']));
</script>
</body>
</html>
