<!doctype html>
<html><head><meta charset="utf-8"><title>Video player</title></head>
<body style="background:#222;color:#fff;width:380px;height:180px">
<!-- the inside of a YouTube embed whose video is private: Oracle's job pages carry one in their media slider
     (live, issue #112, note 33). Its error box is a `.ytp-error` and its "Sign in" a link. -->
<div class="ytp-error"><div class="ytp-error-content-wrap-reason"><span>This video is private</span></div>
<div class="ytp-error-content-wrap-subreason"><span>If the owner of this video has granted you access, please sign in.</span> <a href="#">Sign in</a></div></div>
</body></html>
