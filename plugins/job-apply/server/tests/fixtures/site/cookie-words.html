<!doctype html>
<html>
<head><meta charset="utf-8"><title>Apply - Example Fab</title>
<style>
  #bar { position: fixed; left: 0; right: 0; bottom: 0; background: #eee; padding: 16px; }
</style>
</head>
<body>
<h1>Application Form</h1>
<form id="app" onsubmit="event.preventDefault(); document.body.innerHTML = '<h1>Thank you for applying!</h1>';">
  <label for="fn">First Name *</label><input id="fn" required>
  <label for="ln">Last Name *</label><input id="ln" required>
  <label for="em">Email *</label><input id="em" type="email" required>
  <button type="submit">Submit application</button>
</form>
<!-- a banner named nothing (no cookie, consent, onetrust or gdpr in its ids or classes, no dialog role): only its
     words say what it is (the review of Oct 15) -->
<div id="bar">
  <p>We use cookies to understand how you use our site and to show you relevant jobs.</p>
  <button type="button" onclick="window.accepted = (window.accepted || 0) + 1; document.getElementById('bar').remove();">Accept</button>
  <button type="button" onclick="document.getElementById('bar').remove();">Decline</button>
</div>
</body>
</html>
