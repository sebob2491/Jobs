<!doctype html>
<html>
<head><meta charset="utf-8"><title>Apply</title></head>
<body>
<!-- A step whose Next does nothing, under a box label with a counter ticking in it (the review of 0.3.189: the label
     changed on every look, so the step never looked stuck, and Next was pressed thirty times) -->
<h1>Contact Details</h1>
<form id="app" novalidate>
  <label for="fn">First Name*</label><input id="fn" required>
  <label for="code" id="codel">Reference (expires in <span id="secs">600</span>s)</label><input id="code">
  <button type="button" id="next">Next</button>
</form>
<script>
  let s = 600; setInterval(() => { document.getElementById('secs').textContent = String(--s); }, 250);
  document.getElementById('next').addEventListener('click', () => { window.presses = (window.presses || 0) + 1; });
</script>
</body>
</html>
