<!doctype html>
<html>
<head><meta charset="utf-8"><title>Assessment</title></head>
<body>
<!-- an assessment vendor's pages: an introduction with Start, a page of questions (a scale of agreement for each)
     with Next, a last page (a list and a box) with Submit, which goes back to the application (?back=). A page whose
     questions aren't all answered stays, saying so. ?boxes: its question page is Circle K's (run 60): "1 Question", its
     "Answers" a row of boxes to tick one of, and its Next drawn only once one is ticked. ?welcome: its first page is
     The Predictive Index's (Taylor Morrison's, run 61): "Welcome!", the applicant's name and email (?email=) filled in
     from the employer, and Continue.
     ?boxes&stuck: the boxes all ticked when drawn, and no Next (what Circle K's read as, run 61). The welcome page also
     has The Predictive Index's lone "I have already taken the assessment and would like to enter my Score ID" box:
     ticked, the run goes to a page asking for a Score ID, which never moves on (run 62). ?words: its question page is
     a list of words to tick, at least 2 (PI's stayed, run 62); ?words=many: at least 4, its error saying how many more
     ("Please select 3 more words", as PI's in run 63). ?tiles: its questions are Circle K's (run 62): "1
     Statement", "Answers" drawn as tiles to click (no box) and an Auto Advance switch, on: a click goes on at once;
     below them a Privacy Policy link and a Help tile, never answers. ?tiles=fixed: its heading stays "1 Statement"
     (only the statement changes). Each tile sits in a column of its own (a wrapper with only it). A click on the link
     or Help leaves the assessment (a page with nothing on it). ?tiles=dead: the tiles take no click -->
<h1 id="h">Work Styles Assessment</h1>
<form id="f" onsubmit="return false"></form>
<div id="err" role="alert"></div>
<script>
  const q = new URLSearchParams(location.search);
  const f = document.getElementById('f');
  const err = (t) => { document.getElementById('err').textContent = t; };
  const scale = ['Strongly disagree', 'Disagree', 'Neutral', 'Agree', 'Strongly agree'];
  const radios = (n, text) => `<fieldset><legend>${text}</legend>` + scale.map((s, i) =>
    `<label><input type="radio" name="q${n}" value="${i}"> ${s}</label>`).join('') + '</fieldset>';
  const intro = () => '<p>This assessment takes about 5 minutes.</p><button type="button" class="go">Start</button>';
  const welcome = () => '<h2>Welcome!</h2><label for="fn">First name</label><input id="fn">'
    + '<label for="em">Email</label><input id="em" type="email">'
    + '<input type="checkbox" id="taken"><label for="taken">I have already taken the assessment and would like to '
    + 'enter my Score ID.</label><button type="button" class="go">Continue</button>';
  const scaleQuestions = () => radios(1, 'I like to plan my work ahead.') + radios(2, 'I stay calm under pressure.')
    + radios(3, 'I enjoy working with customers.') + '<button type="button" class="go">Next</button>';
  const choose = () => '<h2>1 Question</h2><p>How often do you finish what you start?</p><h3>Answers</h3>'
    // (?boxes=apart: each box its own, as Circle K's read)
    + ['Always', 'Often', 'Sometimes', 'Never'].map((a, i) => `<label><input type="checkbox" class="a-box" `
      + `name="${q.get('boxes') === 'apart' ? 'a' + i : 'a'}" value="${i}"${q.has('stuck') ? ' checked' : ''}> ${a}</label>`)
      .join('') + '<button type="button" class="go" hidden>Next</button>';
  const words = () => '<fieldset><legend>Please read the words in the list below and check those that describe you'
    + '</legend>' + ['Social', 'Neat', 'Patient', 'Reasonable', 'Content', 'Persistent'].map((w) => '<label><input '
      + `type="checkbox" class="w-box" name="w" value="${w}"> ${w}</label>`).join('')
    + '</fieldset><button type="button" class="go">Continue</button>';
  const said = ['I like to plan my work ahead.', 'I stay calm under pressure.'];
  const tile = (n) => () => `<h2>${q.get('tiles') === 'fixed' ? 1 : n} Statement</h2><p>How strongly do you agree or `
    + `disagree with the following statement?</p><p>${said[n - 1]}</p><h3>Answers</h3><span role="switch" `
    + 'aria-checked="true" tabindex="0">Auto Advance</span><div>'
    + scale.map((s) => `<div class="col"><div class="tile" style="cursor: pointer; padding: 8px"><span>${s}</span></div></div>`).join('')
    + '</div><a href="#privacy" class="away">Privacy Policy</a><div class="away" style="cursor: pointer">Help</div>';
  const last = () => '<label for="shift">Which shift suits you best?</label><select id="shift"><option value="">Select '
    + 'one</option><option>Morning</option><option>Evening</option><option>Night</option></select>'
    + '<label for="why">Why do you want this job?</label><input id="why">'
    + '<button type="button" class="go">Submit</button>';
  const middle = q.has('tiles') ? [tile(1), tile(2)] : q.has('words') ? [words] : q.has('boxes') ? [choose] : [scaleQuestions];
  const pages = [q.has('welcome') ? welcome : intro, ...middle, last];
  let page = 0;
  const on = () => {
    if (page === pages.length - 1) { location.href = q.get('back'); return; }
    page += 1;
    draw();
  };
  function draw() {
    f.innerHTML = pages[page]();
    err('');
    if (page === 0 && q.has('welcome')) {
      f.querySelector('#fn').value = 'Jobdesk';
      f.querySelector('#em').value = q.get('email') || '';
    }
    f.querySelectorAll('.a-box').forEach((b) => b.addEventListener('change', () => {
      f.querySelector('.go').hidden = !f.querySelector('.a-box:checked');
    }));
    if (q.get('tiles') !== 'dead') f.querySelectorAll('.tile').forEach((t) => t.addEventListener('click', on));  // (Auto Advance)
    f.querySelectorAll('.away').forEach((t) => t.addEventListener('click', () => { document.body.innerHTML = ''; }));
    const go = f.querySelector('.go');
    if (!go) return;
    go.addEventListener('click', () => {
      if (f.querySelector('#taken') && f.querySelector('#taken').checked) {
        // (a Score ID it doesn't have: the run's dead end)
        f.innerHTML = '<h2>Enter your Score ID</h2><label for="sid">Score ID</label><input id="sid">'
          + '<button type="button" id="dead">Continue</button>';
        document.getElementById('dead').addEventListener('click', () => err('No assessment was found for that ID.'));
        return;
      }
      const missing = [...f.querySelectorAll('fieldset')].some((fs) => fs.querySelector('input[type=radio]')
          && !fs.querySelector('input:checked'))
        || [...f.querySelectorAll('select, input:not([type=radio]):not([type=checkbox])')].some((b) => !b.value)
        || (f.querySelector('.a-box') && f.querySelectorAll('.a-box:checked').length !== 1);
      if (missing) { err('Please answer every question.'); return; }
      const want = q.get('words') === 'many' ? 4 : 2;  // (?words=many: as PI's, "Please select 3 more words")
      if (f.querySelector('.w-box') && f.querySelectorAll('.w-box:checked').length < want) {
        err(want === 2 ? 'Please select at least 2 words.'
          : `Please select ${want - f.querySelectorAll('.w-box:checked').length} more words.`);
        return;
      }
      on();
    });
  }
  draw();
</script>
</body>
</html>
