<!doctype html>
<html>
<head><meta charset="utf-8"><title>Apply</title></head>
<body>
<!-- a form that writes what's typed into its HTML, as a React site keeps a box's value attribute in
     step, and whose Next stays greyed out: the desk fills it in and stops there -->
<h2>My Information</h2>
<form id="apply" novalidate>
  <label for="fn">First Name *</label><input id="fn" required>
  <label for="ln">Last Name *</label><input id="ln" required>
  <label for="em">Email *</label><input id="em" type="email" required>
  <button type="submit" disabled>Next</button>
</form>
<script>
  for (const box of document.querySelectorAll("input")) box.addEventListener("input", () => box.setAttribute("value", box.value));
</script>
</body>
</html>
