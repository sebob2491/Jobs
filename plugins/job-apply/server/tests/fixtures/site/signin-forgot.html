<!doctype html>
<html>
<head><meta charset="utf-8"><title>Sign In</title></head>
<body>
<!-- a job site where the email already has an account, whose password isn't the one saved on
     the desk: sign-in fails until the password is reset (the reset page sends ?pw= back here).
     After a reset, as Workday's did in live test 2 (issue #112, note 14, Oct 2026), ?done shows "Password has been
     reset" and a "Sign In" button that opens the form, and ?alone asks for the password only, the email shown
     beside it ("Signing in as ..."). ?late=<ms>: the saved password is the account's, and the site takes that long
     to sign in, its form still on show meanwhile (Intel's and TEL's Workday, nightly live check Oct 11). ?slowforgot:
     its "Forgot your password?" goes to the reset page a moment after the click (a script's navigation). ?session: it
     says the session has expired (a site whose password change ends every session), the password reset all the same -->

<h2>Sign In</h2>
<form id="signin" novalidate>
  <label for="em">Email Address</label><input id="em" type="email" required>
  <label for="pw">Password</label><input id="pw" type="password" required>
  <button type="submit">Sign In</button>
</form>
<button type="button" id="forgot">Forgot your password?</button>
<p>Don't have an account yet? <button type="button" id="create">Create Account</button></p>
<div id="err" role="alert"></div>
<script>
  const q = new URLSearchParams(location.search);
  const reset = q.get('pw');
  if (q.has('session')) document.getElementById('err').textContent = 'Your session has expired. Please sign in again.';
  if (reset && q.has('alone')) {
    document.getElementById('em').parentNode.insertBefore(document.createTextNode('Signing in as sam.rivera@example.com'),
                                                          document.getElementById('em'));
    document.querySelector('label[for=em]').remove();
    document.getElementById('em').remove();
  }
  if (reset && q.has('done')) {
    const form = document.getElementById('signin');
    form.hidden = true;
    const note = document.createElement('div');
    note.innerHTML = '<p>Password has been reset</p><button type="button" id="open">Sign In</button>';
    form.parentNode.insertBefore(note, form);
    document.getElementById('open').addEventListener('click', () => { note.remove(); form.hidden = false; });
  }
  document.getElementById('signin').addEventListener('submit', (e) => {
    e.preventDefault();
    if (q.has('late')) setTimeout(() => { location.href = 'step1.html'; }, Number(q.get('late')));
    else if (reset && document.getElementById('pw').value === reset) location.href = 'step1.html';
    else document.getElementById('err').textContent = 'Wrong email address or password. Try again, or create an account.';
  });
  document.getElementById('create').addEventListener('click', () => { location.href = 'create-account-exists.html'; });
  document.getElementById('forgot').addEventListener('click', () => {
    if (location.search.includes('slowforgot')) setTimeout(() => { location.href = 'forgot-password.html'; }, 1500);
    else location.href = 'forgot-password.html';
  });
</script>
</body>
</html>
