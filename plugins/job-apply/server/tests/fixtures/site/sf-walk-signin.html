<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Career Opportunities: Sign In</title></head>
<body>
<!-- Where Apply on an older SuccessFactors posting leads (career?career_ns=job_application&…): sign in, or create an
     account. No account exists here until one is made: every sign-in is refused ("Invalid email or password.";
     counted in sessionStorage's sf.signIns), as at an employer applied to for the first time. "Create an account"
     goes to the career site's Create an Account (login_ns=register: sf-create-account.html, with ?passcode&mail: its
     emailed passcode sent to the fake server's inbox). Made-up employer. -->
<h1>Career Opportunities: Sign In</h1>
<form id="login" novalidate>
  <label for="username">Email Address:</label><input id="username" type="text" aria-required="true">
  <label for="password">Password:</label><input id="password" type="password" aria-required="true">
  <button type="submit">Sign In</button>
</form>
<div id="err" role="alert"></div>
<p><a href="#" id="forgot">Forgot your password?</a></p>
<p>New user? <a href="#" id="create">Create an account</a></p>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('create').href = '/career?company=' + (q.get('company') || 'examplefab')
    + '&login_ns=register&career_job_req_id=' + (q.get('career_job_req_id') || '') + '&passcode&mail';
  document.getElementById('login').addEventListener('submit', (e) => {
    e.preventDefault();
    sessionStorage.setItem('sf.signIns', String(Number(sessionStorage.getItem('sf.signIns') || 0) + 1));
    document.getElementById('err').textContent = 'Invalid email or password.';
  });
  document.getElementById('forgot').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('err').textContent = 'There is no account for this email address.';
  });
</script>
</body>
</html>
