<!doctype html>
<html>
<head><meta charset="utf-8"><title>Equipment Technician | Example Fab Jobs</title></head>
<body>
<!-- like a SuccessFactors job page on an employer's own career site for a posting that has been filled (issue #112, note
     39): the site's header and menus, its job search and its job alert sign-up, then a paragraph that says so, and
     nothing to apply with -->
<header>
  <div class="brand"><a href="#">Your Career at Example Fab</a></div>
  <div class="group"><a href="#">Jobs at Example Group</a></div>
  <div class="lang">Language <select aria-label="Language"><option>English (United States)</option></select></div>
  <div class="account"><a href="#">View profile</a> / <a href="#">Sign in</a></div>
  <div class="employee"><a href="#">Employee login</a></div>
  <div class="search" role="search">
    <input type="search" placeholder="Search by Keyword" aria-label="Search by Keyword">
    <a href="#">Show More Options</a> <a href="#">Clear</a>
  </div>
  <div class="alert">
    <label for="freq">Select how often (in days) to receive an alert:</label>
    <select id="freq"><option>7</option><option>14</option></select>
    <button type="button">CREATE ALERT</button>
  </div>
</header>
<main>
  <p><strong>Sorry, this position has been filled.</strong></p>
</main>
<footer><p>Example Fab is an equal opportunity employer.</p></footer>
</body>
</html>
