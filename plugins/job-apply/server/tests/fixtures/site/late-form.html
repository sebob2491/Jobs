<!doctype html>
<html>
<head><meta charset="utf-8"><title>Personal Info</title></head>
<body>
<!-- like Oracle Recruiting's Personal Info step (Southwest Gas's, American Express's, live): its
     upload boxes and a greyed-out Next come first, its name and email boxes a moment later -->
<h2>Personal Info</h2>
<form id="step" novalidate>
  <div id="later"></div>
  <label for="cv">Upload Resume</label><input id="cv" type="file">
  <button type="submit" id="next" disabled>Next</button>
</form>
<script>
  setTimeout(() => {
    document.getElementById('later').innerHTML =
      '<label for="fn">First Name *</label><input id="fn" required>' +
      '<label for="ln">Last Name *</label><input id="ln" required>' +
      '<label for="em">Email *</label><input id="em" type="email" required>';
    document.getElementById('next').disabled = false;
  }, 2500);
  document.getElementById('step').addEventListener('submit', (e) => {
    e.preventDefault();
    if (['fn', 'ln', 'em'].every((id) => document.getElementById(id).value)) location.href = 'review.html';
  });
</script>
</body>
</html>
