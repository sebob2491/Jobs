<!doctype html>
<html>
<head><meta charset="utf-8"><title>My Information</title></head>
<body>
<div>current step 1 of 3</div>
<h2>My Information</h2>
<form id="step" novalidate>
  <label for="fn">First Name *</label><input id="fn" required>
  <label for="ln">Last Name *</label><input id="ln" required>
  <label for="em">Email *</label><input id="em" type="email" required>
  <label for="ph">Phone Number</label><input id="ph" type="tel">
  <label for="city">City</label><input id="city">
  <label for="st">State</label>
  <select id="st"><option value="">Select One</option><option>Arizona</option><option>Texas</option></select>
  <button type="submit">Save and Continue</button>
</form>
<div id="err" role="alert"></div>
<script>
  document.getElementById('step').addEventListener('submit', (e) => {
    e.preventDefault();
    const missing = ['fn', 'ln', 'em'].filter((id) => !document.getElementById(id).value);
    if (missing.length) document.getElementById('err').textContent = 'Error: ' + missing.length + ' required field(s) are empty';
    else location.href = 'step2.html';
  });
</script>
</body>
</html>
