<!doctype html>
<html>
<head><meta charset="utf-8"><title>Job application form</title></head>
<body>
<!-- like try-later.html (Oracle's email step), but the site's words on NEXT are no rate limit's: "We couldn't send the
     verification code. Please try again later.", shown on the email step itself; its NEXT presses counted for the
     browser (localStorage's nexts: each asks for another code) -->
<div id="page"></div>
<script>
  const step = new URLSearchParams(location.search).get('step') || 'posting';
  const go = (s) => { location.href = location.pathname + '?step=' + s; };
  const page = document.getElementById('page');
  if (step === 'posting') {
    page.innerHTML = '<h2>JOB INFO</h2><h1>Field Service Engineer</h1><p>Install and repair wafer fab equipment.</p>'
      + '<button type="button" id="apply">Apply Now</button>';
    document.getElementById('apply').addEventListener('click', () => go('email'));
  } else {
    page.innerHTML = '<h2>Authentication screen. You don\'t need to have an account</h2>'
      + (step === 'failed' ? '<div role="alert">We couldn\'t send the verification code. Please try again later.</div>' : '')
      + '<form id="f" novalidate><label for="em">Email Address</label><input id="em" type="email" required>'
      + '<button type="submit">NEXT</button></form>';
    document.getElementById('f').addEventListener('submit', (e) => {
      e.preventDefault();
      localStorage.setItem('nexts', String(Number(localStorage.getItem('nexts') || 0) + 1));
      go('failed');
    });
  }
</script>
</body>
</html>
