<!doctype html>
<html>
<head><meta charset="utf-8"><title>Field Service Engineer | Apply</title></head>
<body>
<!-- like Nikon's UKG Pro application (live run 10, Oct 11): a moment after its boxes are typed in, its resume
     parse ("jobdesk-test-resume.pdf has been used to pre-fill part of your application") overwrites the page's
     own record of Address 1 and Zip with nothing, though the boxes still show what was typed. Save and continue
     then says "Address 1 Please enter an address." and "Zip / Postal Code Please enter a valid zip/postal code."
     beside the filled boxes. Typed again after that, they're kept. ?wipe: the parse empties the two boxes too,
     as Nikon's did in live run 12 (they're kept once filled again). ?slow: nothing is lost, and Save and continue
     takes a moment to go on with the parse's notice still showing, as Nikon's Skills did in live run 16 (the
     notice isn't an error). ?silent: as EMD's Phenom (live check, Oct 11), the page loses its record of the
     two boxes and Save and continue says nothing at all: the page just doesn't move on. ?textarea: Address 1 is a text
     area, as Microchip's Workday "Please specify your preferred work location." was (run 84, Oct 14: shown, and
     "required and must have a value" all the same). (kept for the tab: ukg.saves) -->
<h2>Contact Information</h2>
<div id="notice" role="alert"></div>
<form onsubmit="return false">
  <label for="first">First Name *</label><input id="first" required>
  <label for="last">Last Name *</label><input id="last" required>
  <label for="address">Address 1 *</label><input id="address" required>
  <label for="city">City *</label><input id="city" required>
  <label for="zip">Zip / Postal Code *</label><input id="zip" required>
  <div id="errors"></div>
  <button type="button" id="save">Save and continue</button>
</form>
<script>
  if (new URLSearchParams(location.search).has('textarea')) {
    const area = document.createElement('textarea');
    area.id = 'address';
    area.required = true;
    document.getElementById('address').replaceWith(area);
  }
  const model = {};
  let parsed = false;
  const slow = new URLSearchParams(location.search).has('slow');
  document.addEventListener('input', (e) => {
    model[e.target.id] = e.target.value;
    if (!parsed && e.target.id === 'address') {
      parsed = true;
      setTimeout(() => {  // the resume parse lands: the page's record of these two is wiped
        if (!slow) {
          model.address = '';
          model.zip = '';
        }
        if (new URLSearchParams(location.search).has('wipe')) {
          document.getElementById('address').value = '';
          document.getElementById('zip').value = '';
        }
        document.getElementById('notice').textContent =
          'resume.pdf has been used to pre-fill part of your application. Please verify that all of your information is correct.';
      }, 400);
    }
  });
  document.getElementById('save').addEventListener('click', () => {
    sessionStorage.setItem('ukg.saves', String(Number(sessionStorage.getItem('ukg.saves') || 0) + 1));
    const errs = [];
    if (!model.address) errs.push('Address 1 Please enter an address.');
    if (!model.zip) errs.push('Zip / Postal Code Please enter a valid zip/postal code.');
    const silent = new URLSearchParams(location.search).has('silent');  // (nothing said: it just doesn't move)
    if (!silent) document.getElementById('errors').innerHTML = errs.map((t) => '<p role="alert" class="error">' + t + '</p>').join('');
    // (Workday marks the box it lost invalid: Microchip's text area, run 84)
    if (new URLSearchParams(location.search).has('textarea')) {
      document.getElementById('address').setAttribute('aria-invalid', model.address ? 'false' : 'true');
    }
    if (!errs.length) setTimeout(() => { location.href = 'review.html'; }, slow ? 1500 : 0);
  });
</script>
</body>
</html>
