<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>jobs.example-ats.example</title></head>
<body style="margin:0">
<!-- A DataDome block over a job's page, as SmartRecruiters' showed Wynn's and Boyd's postings live (run 144): the
     page is nothing but a full-height frame from geo.captcha-delivery.com, titled "DataDome CAPTCHA". The frame's own
     page (served by the test: "Access is temporarily restricted", a "Submit feedback." button, and its contact form's
     "Comment" box) was read as the application's form, and the desk said it couldn't find the way on. A bot check:
     the person's, never the desk's to get past. -->
<iframe src="https://geo.captcha-delivery.com/captcha/?initialCid=test&amp;t=bv" title="DataDome CAPTCHA"
        width="100%" height="100%" style="height:100vh; border:0" allow="accelerometer; gyroscope; magnetometer"
        sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
</body>
</html>
