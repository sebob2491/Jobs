<!doctype html>
<html>
<head><meta charset="utf-8"><title>Forgot Password</title></head>
<body>
<h2>Forgot Password</h2>
<p>Enter your email address and we'll email you a link to reset your password.</p>
<form id="forgot" novalidate>
  <label for="em">Email Address*</label><input id="em" type="email" required>
  <button type="submit">Submit</button>
</form>
<div id="err" role="alert"></div>
<script>
  // ?odd: a reset the desk can't fill in (it asks a security question, not the email), as UKG Pro's
  // and SuccessFactors' were for the test identity (live, Oct 2026)
  if (location.search.includes('odd')) {
    document.body.innerHTML = '<h2>Reset your password</h2><form><label for="sq">What was the name of your ' +
      'first school?</label><input id="sq" type="text"><button type="submit">Continue</button></form>';
  }
  // ?unknown: the site has no account for the email (SuccessFactors' says so)
  // ?workday: Workday's, which stays on the form and says, in its alert, that an email comes "if an
  // account exists" (live, Oct 2026); ?workday-late: the same a moment after the press
  if (document.getElementById('forgot')) document.getElementById('forgot').addEventListener('submit', (e) => {
    e.preventDefault();
    if (!document.getElementById('em').value) return;
    if (location.search.includes('unknown')) {
      document.getElementById('err').textContent = 'There is no user with that username or email';
      return;
    }
    if (location.search.includes('workday')) {
      const say = () => { document.getElementById('err').textContent = 'You will receive an email with ' +
        'instructions to reset your password if an account exists for this email address.'; };
      if (location.search.includes('late')) setTimeout(say, 1500); else say();
      return;
    }
    document.body.innerHTML = '<h2>Check your email</h2><p>We have sent a link to reset your password to your email address.</p>';
  });
</script>
</body>
</html>
