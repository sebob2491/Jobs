<!doctype html>
<html>
<head><meta charset="utf-8"><title>Quick Apply</title></head>
<body>
<!-- like Phoenix Children's Quick Apply (live, Oct 2026): the posting's "Apply!" only scrolls to
     the form, and the form's Next stays greyed out until a resume is attached -->
<h2>Talent Acquisition Coordinator</h2>
<a href="#apply">Apply!</a>
<form id="apply" novalidate>
  <label for="fn">First Name *</label><input id="fn" required>
  <label for="ln">Last Name *</label><input id="ln" required>
  <label for="cv">Resume</label><input id="cv" type="file">
  <button type="submit" disabled>Next</button>
</form>
</body>
</html>
