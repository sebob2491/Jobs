<!doctype html>
<html>
<head><meta charset="utf-8"><title>Sign In</title></head>
<body>
<!-- no account for this email yet: sign-in fails until Create Account has made one, after which
     the site comes back here (?created=1) to sign in -->
<h2>Sign In</h2>
<p id="note"></p>
<form id="signin" novalidate>
  <label for="em">Email Address</label><input id="em" type="email" required>
  <label for="pw">Password</label><input id="pw" type="password" required>
  <button type="submit">Sign In</button>
</form>
<button type="button" id="forgot">Forgot your password?</button>
<p>Don't have an account yet? <button type="button" id="create">Create Account</button></p>
<div id="err" role="alert"></div>
<script>
  const made = new URLSearchParams(location.search).get('created');
  if (made) document.getElementById('note').textContent = 'Your account was created. Sign in to continue.';
  document.getElementById('signin').addEventListener('submit', (e) => {
    e.preventDefault();
    if (made && document.getElementById('pw').value) location.href = 'step1.html';
    else document.getElementById('err').textContent = 'Wrong email address or password. Try again, or create an account.';
  });
  document.getElementById('create').addEventListener('click', () => { location.href = 'create-account-signin.html'; });
  document.getElementById('forgot').addEventListener('click', () => { location.href = 'forgot-password.html'; });
</script>
</body>
</html>
