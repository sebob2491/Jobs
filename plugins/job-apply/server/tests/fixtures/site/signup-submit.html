<!doctype html>
<html>
<head><meta charset="utf-8"><title>Sign up</title></head>
<body>
<!-- a sign-up form with one password box whose own submit button reads "Create Account":
     pressing it creates the account, which is the person's call -->
<h1>Create your account</h1>
<form id="signup" novalidate>
  <label for="em">Email address *</label><input id="em" type="text" required>
  <label for="pw">Password *</label><input id="pw" type="password" required>
  <button type="submit">Create Account</button>
</form>
<p>Already have an account? <a href="signin-signup-submit.html">Log in</a></p>
<script>
  window.created = 0;
  document.getElementById('signup').addEventListener('submit', (e) => { e.preventDefault(); window.created += 1; });
</script>
</body>
</html>
