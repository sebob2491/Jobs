<!doctype html>
<html>
<head><meta charset="utf-8"><title>Reset Password</title></head>
<body>
<!-- ?slow=<ms>: the site takes that long over the new password, the form still on show, no error, as Workday's
     did before it went to its sign-in (issue #112, note 34). ?spent: a link opened before, which sets nothing and
     says nothing of it, going on to the sign-in all the same (KLA's Workday, the reset probe's second pass, run 136,
     as far as the desk could tell). ?expired: the form goes, and the page says the link has expired. A spent link as
     it opens: ?gone says it has expired, with no form; ?straight goes on to the sign-in at once, saying nothing -->
<h2>Reset Password</h2>
<form id="reset" novalidate>
  <label for="pw">New Password*</label><input id="pw" type="password" required>
  <label for="pw2">Verify New Password*</label><input id="pw2" type="password" required>
  <button type="submit">Reset Password</button>
</form>
<div id="err" role="alert"></div>
<script>
  const opened = new URLSearchParams(location.search);
  if (opened.has('straight')) location.replace('signin-forgot.html');
  if (opened.has('gone')) {
    document.getElementById('reset').remove();
    document.getElementById('err').textContent = 'This link has expired. Request a new password reset from the ' +
      'sign-in page.';
    document.body.insertAdjacentHTML('beforeend', '<a href="signin-forgot.html">Back to Sign In</a>');
  }
  if (document.getElementById('reset')) document.getElementById('reset').addEventListener('submit', (e) => {
    e.preventDefault();
    const pw = document.getElementById('pw').value;
    // ?then=<variant>: passed on to the sign-in page (signin-forgot.html's ?done or ?alone)
    const q = new URLSearchParams(location.search);
    const then = q.get('then');
    if (pw && pw === document.getElementById('pw2').value && q.has('expired')) {
      document.body.innerHTML = '<h2>Reset Password</h2><div role="alert">This link has expired. Request a new ' +
        'password reset from the sign-in page.</div><a href="signin-forgot.html">Back to Sign In</a>';
    }
    else if (pw && pw === document.getElementById('pw2').value) {
      const go = () => {
        location.href = 'signin-forgot.html' + (q.has('spent') ? '' : '?pw=' + encodeURIComponent(pw) + (then ? '&' + then : ''));
      };
      const slow = Number(new URLSearchParams(location.search).get('slow') || 0);
      if (slow) setTimeout(go, slow); else go();
    }
    else document.getElementById('err').textContent = 'The passwords must match';
  });
</script>
</body>
</html>
