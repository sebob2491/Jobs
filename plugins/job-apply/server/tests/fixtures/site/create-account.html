<!doctype html>
<html>
<head><meta charset="utf-8"><title>Create Account</title></head>
<body>
<h2>Create Account</h2>
<form id="create" novalidate>
  <label for="em">Email Address*</label><input id="em" type="email" required>
  <label for="pw">Password*</label><input id="pw" type="password" required>
  <label for="pw2">Verify New Password*</label><input id="pw2" type="password" required>
  <label><input id="terms" type="checkbox" required> Yes, I have read and consent to the terms and conditions</label>
  <button type="submit">Create Account</button>
</form>
<div id="err" role="alert"></div>
<script>
  window.created = 0;
  document.getElementById('create').addEventListener('submit', (e) => {
    e.preventDefault();
    const pw = document.getElementById('pw').value;
    const ok = document.getElementById('em').value && pw && pw === document.getElementById('pw2').value
      && document.getElementById('terms').checked;
    // ?slow: like a Workday site (live), the new account's Sign In page comes a few seconds later
    if (ok && location.search.includes('slow')) {
      window.created += 1;
      setTimeout(() => { location.href = 'signin-forgot.html?pw=' + encodeURIComponent(pw); }, 2500);
    } else if (ok) { window.created += 1; location.href = 'step1.html'; }
    else document.getElementById('err').textContent = 'Error: complete every field and accept the terms';
  });
</script>
</body>
</html>
