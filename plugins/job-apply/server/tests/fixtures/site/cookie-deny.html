<!doctype html>
<html>
<head><meta charset="utf-8"><title>Apply - Example Fab</title>
<style>
  #onetrust-consent-sdk .onetrust-pc-dark-filter { position: fixed; inset: 0; background: rgba(0,0,0,.4); }
  #onetrust-banner-sdk { position: fixed; left: 10%; right: 10%; top: 30%; background: #fff; padding: 20px; }
</style>
</head>
<body>
<!-- a OneTrust-style banner whose way to decline is "Deny": the accept button is a box of its own
     by its id, inside the banner holding the other choices -->
<h1>Application Form</h1>
<form id="app" onsubmit="event.preventDefault(); document.body.innerHTML = '<h1>Thank you for applying!</h1>';">
  <label for="fn">First Name *</label><input id="fn" required>
  <label for="ln">Last Name *</label><input id="ln" required>
  <label for="em">Email *</label><input id="em" type="email" required>
  <button type="submit">Submit application</button>
</form>
<div id="onetrust-consent-sdk">
  <div class="onetrust-pc-dark-filter"></div>
  <div id="onetrust-banner-sdk" role="region" aria-label="Cookie banner">
    <p>We use cookies to improve your experience on our site.</p>
    <div id="onetrust-button-group">
      <button id="onetrust-accept-btn-handler"
              onclick="window.accepted = (window.accepted || 0) + 1; document.getElementById('onetrust-consent-sdk').remove();">Allow all</button>
      <button id="onetrust-reject-all-handler"
              onclick="window.denied = (window.denied || 0) + 1; document.getElementById('onetrust-consent-sdk').remove();">Deny</button>
    </div>
  </div>
</div>
</body>
</html>
