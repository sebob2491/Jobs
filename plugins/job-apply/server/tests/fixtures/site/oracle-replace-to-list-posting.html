<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Resort Guest Room Attendant - Careers</title></head>
<body>
<!-- An Oracle Recruiting Cloud posting whose only "Apply Now" takes the tab to the site's list of jobs with
     location.replace: the posting leaves the tab's history, so the browser's Back doesn't come back to it (the review
     of the Station Casinos fix, run 144). Made-up employer and job. -->
<main>
  <h1>Resort Guest Room Attendant</h1>
  <p>Las Vegas, NV, United States · Posting Date 10/01/2026 · Job Identification 1001</p>
  <h2>Job Description</h2>
  <p>Clean and prepare guest rooms to the resort's standards.</p>
  <button type="button" id="apply">Apply Now</button>
</main>
<script>
  document.getElementById('apply').addEventListener('click', () => {
    location.replace('/hcmUI/CandidateExperience/en/sites/CX_1/requisitions');
  });
</script>
</body>
</html>
