<!doctype html>
<html>
<head><meta charset="utf-8"><title>Final Questions</title></head>
<body>
<h2>Final Questions</h2>
<form id="final" novalidate>
  <label for="why">Why do you want to work here? *</label><textarea id="why" required></textarea>
  <button type="submit">Submit Application</button>
</form>
<div id="err" role="alert"></div>
<script>
  window.sent = 0;
  document.getElementById('final').addEventListener('submit', (e) => {
    e.preventDefault();
    if (!document.getElementById('why').value) {
      document.getElementById('err').textContent = 'Error: please answer every required question';
      return;
    }
    window.sent += 1;
    document.body.innerHTML = '<h1>Thank you for applying!</h1>';
  });
</script>
</body>
</html>
