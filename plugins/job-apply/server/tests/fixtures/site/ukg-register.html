<!doctype html>
<html>
<head><meta charset="utf-8"><title>Example Fab Master Company | Register</title></head>
<body>
<!-- like UKG Pro's second Create Account step (Nikon Precision, live, Oct 2026): after the sign-up's
     email, password and Continue, its own Register page asks for a name and phone. The consent box's
     words sit beside it, not in a label, and "Create account" is greyed out until it's ticked. A box
     for text messages about jobs (never ticked for the person) sits beside it here too. ?component:
     "Create account" is a web component, as live, whose own "form" property isn't a form (the desk's
     click threw "el.form.elements is not iterable"). ?security: the page also asks a security question and its
     answer (under a "Security questions" heading) and a "City of birth", the person's (security: what's in them);
     ?captcha: a picture code to type ("Enter the text in image above") -->
<div class="note">
  <h3>Accessibility Note:</h3>
  <p>If you need an accommodation to apply, see Accessibility Accommodation for Applicants.</p>
  <button type="button" onclick="this.parentElement.remove()">Dismiss Note</button>
</div>
<div class="card">
  <div class="card-title">Almost there!</div>
  <p>Please provide your name to set up your account</p>
  <form id="register" novalidate>
    <div><label for="fn">First name *</label><input id="fn" type="text"></div>
    <div><label for="ln">Last name *</label><input id="ln" type="text"></div>
    <div><label for="ph">Phone number *</label><input id="ph" type="tel"></div>
    <div class="consent">
      <input id="consent" type="checkbox" value="">
      <span>By checking this box, I have read and agree to the <a href="#policy">Consent and Privacy Policy</a>*</span>
    </div>
    <div><label><input id="texts" type="checkbox"> I agree to receive text messages (SMS) about jobs like this one</label></div>
    <button type="submit" id="create" disabled>Create account</button>
  </form>
</div>
<div id="err" role="alert"></div>
<script>
  const did = (k, v) => sessionStorage.setItem('ukg.' + k, JSON.stringify(v));
  if (location.search.includes('component')) {
    customElements.define('ukg-button', class extends HTMLElement {
      get type() { return 'submit'; }
      get form() { return { id: 'register' }; }  // (not a form: a component's own property)
      get disabled() { return this.hasAttribute('disabled'); }
      set disabled(v) { this.toggleAttribute('disabled', !!v); this.setAttribute('aria-disabled', String(!!v)); }
      connectedCallback() {
        this.setAttribute('role', 'button');
        this.addEventListener('click', () => { if (!this.disabled) document.getElementById('register').requestSubmit(); });
      }
    });
    const old = document.getElementById('create');
    const button = document.createElement('ukg-button');
    button.id = 'create';
    button.textContent = 'Create account';
    button.disabled = true;
    old.replaceWith(button);
  }
  if (location.search.includes('security')) {
    document.getElementById('texts').parentElement.parentElement.insertAdjacentHTML('afterend', '<h3>Security questions</h3>'
      + '<div><label for="sq">Question 1 *</label><select id="sq"><option value="">Select question</option>'
      + '<option>In what city were you born?</option></select></div>'
      + '<div><input id="sa" type="text" placeholder="Answer" aria-label="Question 1 Answer"></div>'
      + '<div><label for="cb">City of birth</label><input id="cb" type="text"></div>');
    ['sq', 'sa', 'cb'].forEach((id) => document.getElementById(id).addEventListener('change', () => did('security',
      ['sq', 'sa', 'cb'].map((k) => document.getElementById(k).value))));
  }
  if (location.search.includes('captcha')) {
    document.getElementById('texts').parentElement.parentElement.insertAdjacentHTML('afterend', '<div>'
      + '<img alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="150" height="40">'
      + '<label for="pc">Enter the text in image above</label><input id="pc" type="text"></div>');
  }
  const consent = document.getElementById('consent');
  consent.addEventListener('change', () => { document.getElementById('create').disabled = !consent.checked; });
  document.getElementById('register').addEventListener('submit', (e) => {
    e.preventDefault();
    const missing = ['fn', 'ln', 'ph'].filter((id) => !document.getElementById(id).value);
    did('presses', JSON.parse(sessionStorage.getItem('ukg.presses') || '0') + 1);
    did('texts', document.getElementById('texts').checked);
    if (missing.length || !consent.checked) {
      document.getElementById('err').textContent = 'Please complete every field';
      return;
    }
    did('created', true);
    location.href = 'step1.html';
  });
</script>
</body>
</html>
