<!doctype html>
<html>
<head><meta charset="utf-8"><title>Career Opportunities: Sign In</title></head>
<body>
<!-- SuccessFactors' sign-in (SAP's Gigya): the whole page sits in one big form, and the sign-in's
     own button reads "Submit". ?pw=<password> is the account's password; ?extra puts a phone box
     beside the sign-in; ?unknown: the site has no account for the email; ?reset=<mode>: the
     password reset's ?<mode> (forgot-password.html); ?s=<token>: good for one visit (sf-posting.html) -->
<form id="careerform" onsubmit="return false;">
  <input type="hidden" name="career_company" value="example">
  <h2>Sign In</h2>
  <p>To continue with your application, please sign in or create an account.</p>
  <button type="button">LinkedIn</button> <button type="button">Google</button>
  <button type="button">Facebook</button> <button type="button">Apple</button>
  <div class="gigya-login-form">
    <p>Log in with your email and password</p>
    <label for="username">Email</label><input id="username" type="text" name="username" aria-label="Email">
    <label for="password">Password *</label><input id="password" type="password" name="password">
    <button type="button" aria-label="Show Password">&#128065;</button>
    <span id="extra"></span>
    <a href="javascript:void(0)" role="button" id="forgot">Forgot your password?</a>
    <input type="submit" value="Submit" id="go">
    <div id="err" role="alert"></div>
    <a href="javascript:void(0)" role="button" id="create">Don't have an account yet?</a>
  </div>
</form>
<script>
  const q = new URLSearchParams(location.search);
  // ?s=<token> (from sf-posting.html): SuccessFactors' sign-in page, good for one visit
  const used = JSON.parse(sessionStorage.getItem('sf.used') || '[]');
  if (q.get('s') && used.includes(q.get('s'))) {
    document.body.innerHTML = '<a href="#">SuccessFactors</a><p><b>An error occurred while processing your ' +
      'request. Please go back to your original page and check the URL. Then try your request again.</b></p>';
    throw new Error('sign-in page opened again');
  }
  if (q.get('s')) sessionStorage.setItem('sf.used', JSON.stringify([...used, q.get('s')]));
  window.signInTries = 0;
  if (q.has('extra')) {
    document.getElementById('extra').innerHTML = '<label for="ph">Phone</label><input id="ph" type="tel" name="phone">';
  }
  document.getElementById('go').addEventListener('click', () => {
    window.signInTries += 1;
    if (q.get('pw') && document.getElementById('password').value === q.get('pw')) location.href = 'step1.html';
    else document.getElementById('err').textContent = 'Invalid login or password';
  });
  document.getElementById('forgot').addEventListener('click', () => {
    location.href = 'forgot-password.html' + (q.has('unknown') ? '?unknown' : q.get('reset') ? '?' + q.get('reset') : '');
  });
  document.getElementById('create').addEventListener('click', () => { location.href = 'create-account.html'; });
</script>
</body>
</html>
