<!doctype html>
<html>
<head><meta charset="utf-8"><title>Senior Analyst | Example Corp Careers</title></head>
<body>
<!-- like Edward Jones' BrassRing (TGnewUI, live, Oct 2026): one page that draws the posting, its sign-in,
     the password reset and Create Account in place, all at the posting's address (with its #jobDetails=…),
     so going to that address again leaves the page as it is; a reload shows the posting. "Apply to job"
     shows "Choose your sign in option" (Email address and Password; Back, Sign in with LinkedIn, Forgot
     Username or Password?, Sign in, Don't have an account yet?), where no password signs in ("Email or
     Username incorrect.", "Password incorrect."). Its reset asks for the email and a picture code ("Enter
     Captcha"), and its Continue without the code says "One or more fields require your attention. Captcha
     text Required field". Its Create Account ("Let's Get Started") asks for the email first, then emails a
     passcode to it. ?captcha: a picture code on Create Account too. ?refuse: its Continue refuses the email
     ("Please enter a valid email address.") and stays. ?stay: the passcode step is drawn below the email step,
     whose Email address and Continue stay (live, Oct 2026: a press of that Continue sends another passcode,
     and the boxes are emptied). ?keys: each digit box takes a digit only from a key pressed in it, and moves on to
     the next box; a value set by a script is wiped (live run 9, Oct 11: the code went in and Verify Passcode was
     pressed, and the step stayed with its boxes empty). What happened is kept for the tab
     (sessionStorage's br.* keys), so a reload doesn't lose it: signIns, resetPresses, captcha (anything
     typed in a picture code), accountEmail (the email Create Account's Continue sent). After the passcode, its
     account form (run 67): the email shown, a password twice, a security question and its answer; accountForm
     (what's in it) and accountMade (its Continue's presses). ?other: that form shows another email -->
<header><a href="javascript:void(0)" id="top-sign-in">Sign In</a> <a href="javascript:void(0)">Example Corp Careers</a></header>
<main id="view"></main>
<footer><a href="javascript:void(0)">Contact Us</a> <a href="javascript:void(0)">Privacy Policy</a></footer>
<script>
  const q = new URLSearchParams(location.search);
  const got = (k, d) => JSON.parse(sessionStorage.getItem('br.' + k) || JSON.stringify(d));
  const put = (k, v) => sessionStorage.setItem('br.' + k, JSON.stringify(v));
  const bump = (k) => put(k, got(k, 0) + 1);
  const view = document.getElementById('view');
  const $ = (id) => document.getElementById(id);
  if (!location.hash) history.replaceState(null, '', '#jobDetails=1427502_5374');
  const picture = (id) => '<img alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="200" height="50">'
    + '<button type="button">Refresh captcha</button> <button type="button">Audio captcha</button>'
    + '<input id="' + id + '" type="text" placeholder="Enter Captcha">';
  const watch = (id) => { if ($(id)) $(id).addEventListener('input', () => put('captcha', $(id).value)); };

  function posting() {
    document.title = 'Senior Analyst | Example Corp Careers';
    view.innerHTML = '<h1>Senior Analyst</h1><p>Opportunity Overview</p><p>Analyzes financial results and '
      + 'reconciliations.</p><button type="button" id="apply">Apply to job</button> <button type="button">Save</button>';
    $('apply').addEventListener('click', signIn);
  }

  function signIn() {
    document.title = 'Sign In';
    view.innerHTML = '<button type="button" id="back">Back</button>'
      + '<h2>Choose your sign in option</h2><p>You can sign in using social media or with your Email address and password.</p>'
      + '<button type="button">Sign in with LinkedIn</button><p>Or</p>'
      + '<form id="signin" novalidate><p>Sign in using username and password</p>'
      + '<label for="em">*Email address</label><input id="em" type="text" required>'
      + '<label for="pw">*Password</label><input id="pw" type="password" required>'
      + '<a href="javascript:void(0)" id="forgot">Forgot Username or Password?</a>'
      + '<button type="submit">Sign in</button>'
      + '<div id="err" role="alert"></div>'
      + '<a href="javascript:void(0)" id="create">Don\'t have an account yet?</a></form>';
    $('signin').addEventListener('submit', (e) => {
      e.preventDefault();
      bump('signIns');
      $('err').innerHTML = '<p>Email or Username incorrect.</p><p>Password incorrect.</p>';
    });
    $('back').addEventListener('click', posting);
    $('forgot').addEventListener('click', forgot);
    $('create').addEventListener('click', create);
  }

  function forgot() {
    document.title = 'Forgot Username or Password';
    view.innerHTML = '<h1>Forgot password</h1><button type="button" id="back">Back</button>'
      + '<h2>Having Trouble Signing In?</h2><form id="reset" novalidate>'
      + '<label><input type="radio" name="trouble" checked> I don\'t know my password.</label>'
      + '<label><input type="radio" name="trouble"> I don\'t know my username.</label>'
      + '<h3>Enter the email associated with your account</h3>'
      + '<label for="rem">*Email</label><input id="rem" type="text" required>' + picture('code')
      + '<button type="submit">Continue</button> <a href="javascript:void(0)" id="cancel">Cancel</a>'
      + '<div id="err" role="alert"></div></form>';
    watch('code');
    $('reset').addEventListener('submit', (e) => {
      e.preventDefault();
      bump('resetPresses');
      if (!$('code').value) {
        $('err').innerHTML = '<p>One or more fields require your attention.</p><a href="#code">Captcha text Required field</a>';
        return;
      }
      $('err').textContent = 'Invalid captcha. Please try again.';
    });
    $('back').addEventListener('click', signIn);
    $('cancel').addEventListener('click', signIn);
  }

  function create() {
    document.title = 'Create new account';
    view.innerHTML = '<button type="button" id="back">Back</button><h2>Let\'s Get Started</h2>'
      + '<p>To create an account, use a social network login or create a new login.</p>'
      + '<div role="tablist"><span role="tab">Social network</span> <span role="tab" aria-selected="true">Create new '
      + 'account</span></div>'
      + '<form id="account" novalidate><h3>Account Information</h3>'
      + '<label for="aem">*Email address</label><input id="aem" type="text" required>'
      + (q.has('captcha') ? picture('acode') : '')
      + '<button type="submit">Continue</button> <a href="javascript:void(0)" id="cancel">Cancel</a>'
      + '<div id="err" role="alert"></div></form>';
    watch('acode');
    $('account').addEventListener('submit', (e) => {
      e.preventDefault();
      bump('accountPresses');
      if (q.has('refuse')) {
        $('err').innerHTML = '<p>Please enter a valid email address.</p>';
        return;
      }
      if (!$('aem').value || q.has('captcha') && !$('acode').value) {
        $('err').innerHTML = '<p>One or more fields require your attention.</p>';
        return;
      }
      put('accountEmail', $('aem').value);
      passcode($('aem').value);
    });
    $('back').addEventListener('click', signIn);
    $('cancel').addEventListener('click', signIn);
  }

  function passcode(address) {
    const ordinals = ['1st', '2nd', '3rd', '4th', '5th', '6th'];
    const step = '<h2>Verify Passcode</h2><p>We’ve sent a passcode to validate your email address to '
      + address + ', with the subject “Your Passcode”, which will expire in 10 minutes. Be sure to check your '
      + 'Spam or Junk Mail folder if you do not see it in your Inbox, or <a href="javascript:void(0)" '
      + 'id="resend">resend the passcode</a>.</p><div id="digits">'
      + ordinals.map((o) => '<input type="text" inputmode="numeric" maxlength="1" class="digit" '
        + 'aria-label="Enter ' + o + ' digit of your passcode">').join(' ')
      + '</div><button type="button" id="verify">Verify Passcode</button><div id="perr" role="alert"></div>';
    if (q.has('stay')) view.insertAdjacentHTML('beforeend', step);
    else view.innerHTML = '<h2>Let\'s Get Started</h2>' + step;
    const boxes = [...document.querySelectorAll('.digit')];
    if (q.has('keys')) {
      boxes.forEach((box, i) => {
        box.addEventListener('keydown', (e) => {
          if (!/^\d$/.test(e.key)) return;
          e.preventDefault();
          box.value = e.key;
          if (boxes[i + 1]) boxes[i + 1].focus();
        });
        box.addEventListener('input', () => { box.value = ''; });  // not from a key: the model never saw it
      });
    } else {
      boxes.forEach((box, i) => box.addEventListener('input', () => {
        box.value = box.value.replace(/\D/g, '').slice(0, 1);
        if (box.value && boxes[i + 1]) boxes[i + 1].focus();
      }));
    }
    $('verify').addEventListener('click', () => {
      const typed = boxes.map((b) => b.value).join('');
      bump('verifies');
      put('passcode', typed);
      if (typed.length < 6) {
        $('perr').innerHTML = '<p>Please enter the 6-digit passcode.</p>';
        return;
      }
      account(address);
    });
  }

  // the account itself, once the passcode is verified (run 67): the email shown, not asked; a password twice; a
  // security question to choose and its answer, the person's; Continue makes the account (accountMade)
  function account(address) {
    view.innerHTML = '<div role="status"><h3>Passcode successfully validated.</h3></div><h2>Let\'s Get Started</h2>'
      + '<div role="tablist"><span role="tab" aria-selected="true">Create new account</span></div>'
      + '<form id="made" novalidate><p>Fields marked with an asterisk (*) are required.</p><h3>Account Information</h3>'
      + '<p>*Email address</p><p>' + (q.has('other') ? 'someone.else@example.org' : address) + '</p>'
      + '<label><input type="checkbox" id="twofa"> Enable 2-Factor Sign In by Email</label>'
      + '<label for="np">*Password</label><input id="np" type="password" required>'
      + '<label for="np2">*Re-enter password</label><input id="np2" type="password" required>'
      + '<h3>Security questions</h3>' + (q.has('selectmenu')
        // ?selectmenu: as BrassRing draws it live (run 68), a jQuery UI selectmenu: the select hidden, a span button
        // standing in for it ("<id>-button"), whose menu ("<id>-menu") lists the choices to click
        ? '<label for="sq-button">* Question 1</label><select id="sq" required style="display: none">'
          + '<option value="" disabled selected>Select question</option><option value="0">What was the name of your '
          + 'first pet?</option><option value="1">In what city were you born?</option></select>'
          + '<span tabindex="0" id="sq-button" role="button" aria-expanded="false" aria-owns="sq-menu" '
          + 'aria-haspopup="listbox" class="ui-selectmenu-button"><span class="ui-selectmenu-icon"></span>'
          + '<span class="ui-selectmenu-text" id="sq-button_text">Select question</span></span>'
          + '<div class="ui-selectmenu-menu"><ul id="sq-menu" role="listbox" aria-hidden="true"></ul></div>'
        // (?minusone: its placeholder's value is "-1", not empty)
        : '<label for="sq">* Question 1</label><select id="sq" required>'
          + '<option value="' + (q.has('minusone') ? '-1' : '') + '">Select question</option>'
          + '<option>What was the name of your first pet?</option>'
          + '<option>In what city were you born?</option></select>')
      + '<input id="sa" type="text" placeholder="Answer" aria-label="Question 1 Answer">'
      + (q.has('formcaptcha') ? picture('fcode') : '')  // (?formcaptcha: a picture code on this form too)
      + '<button type="submit">Continue</button> <a href="javascript:void(0)" id="cancel">Cancel</a>'
      + '<div id="aerr" role="alert"></div></form>';
    const typed = () => put('accountForm', {passwords: [$('np').value, $('np2').value].filter(Boolean).length,
      question: $('sq').value && $('sq').options[$('sq').selectedIndex].text, answer: $('sa').value,
      twofa: $('twofa').checked});
    if (q.has('selectmenu')) {  // (the menu opens on a click on its button; a choice sets the select, as jQuery UI's)
      const button = $('sq-button'), menu = $('sq-menu');
      button.addEventListener('click', () => {
        const open = button.getAttribute('aria-expanded') === 'true';
        button.setAttribute('aria-expanded', String(!open));
        menu.setAttribute('aria-hidden', String(open));
        menu.innerHTML = open ? '' : Array.from($('sq').options).filter((o) => o.value !== '').map((o) =>
          `<li class="ui-menu-item"><div role="option" tabindex="-1" class="ui-menu-item-wrapper" data-v="${o.value}">`
          + `${o.text}</div></li>`).join('');
        menu.querySelectorAll('[role="option"]').forEach((div) => div.addEventListener('click', () => {
          $('sq').value = div.dataset.v;
          $('sq-button_text').textContent = div.textContent;
          $('sq').dispatchEvent(new Event('change'));
          menu.innerHTML = '';
          menu.setAttribute('aria-hidden', 'true');
          button.setAttribute('aria-expanded', 'false');
        }));
      });
    }
    ['np', 'np2', 'sq', 'sa', 'twofa'].forEach((id) => $(id).addEventListener('change', typed));
    ['np', 'np2', 'sa'].forEach((id) => $(id).addEventListener('input', typed));
    $('made').addEventListener('submit', (e) => {
      e.preventDefault();
      bump('accountMade');
      if (!$('np').value || !$('sq').value || !$('sa').value) {
        $('aerr').innerHTML = '<p>Required field</p><p>Select question</p>';
      }
    });
  }

  $('top-sign-in').addEventListener('click', signIn);
  posting();
</script>
</body>
</html>
