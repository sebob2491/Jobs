<!doctype html>
<html>
<head><meta charset="utf-8"><title>Career Opportunities: Equipment Technician (10557)</title>
<style>
  .rcmpaginatedselectlist { display: none; border: 1px solid #999; max-height: 200px; overflow: auto; }
  .rcmpaginatedselectlist.open { display: block; min-height: 1em; }
  .rcmpaginatedselectlist [role="option"] { padding: 2px 4px; cursor: pointer; }
</style>
</head>
<body>
<!-- SuccessFactors' self-identification lists (Freeport-McMoRan's Ethnicity, Edwards Vacuum's Protected Veteran, Rogers'
     Gender and Ethnicity, Oct 2026): a "paginated select" whose entries are fetched from the server the first time the
     list opens, a few seconds on their servers (?slow=<ms>: the list opens empty, its entries drawn that long after;
     every later opening shows them at once; &placeholderfirst: the first opening shows "No Selection" alone until
     then, as Amkor's list opens); &nolist: the list isn't in the page at all until its entries came, nor the box said
     expanded (as Edwards Vacuum's and Freeport-McMoRan's draw theirs, run 111), and goes from the page again when
     closed; &closes: an opening after the box was left (it lost the focus) closes again by itself a moment later,
     none of its entries drawn (Edwards Vacuum's Protected Veteran, run 114: its choices shown for a moment, the list
     gone again before they were read; opened again from the box, they stay). "No Selection" is the empty choice. -->
<h1>Career Opportunities: Equipment Technician (10557)</h1>
<form id="apply" novalidate>
  <label for="fn">Legal First Name *</label><input id="fn" required>
  <div class="sel paginatedPicklistContainer">
    <input aria-label="Pre-Offer : Are you a Protected Veteran?" autocomplete="off" type="text"
           placeholder="No Selection" role="combobox" aria-owns="52:_listSelect" aria-required="true"
           aria-expanded="false" id="51:_input" class="rcmpaginatedselectinput rcmpaginatedselectitem">
    <button aria-label="Pre-Offer : Are you a Protected Veteran?" tabindex="-1" type="button" id="51:_selectButton"
            class="rcmpaginatedselectbutton fd-select__button">&#9662;</button>
    <div id="52:_listSelect" role="listbox" class="rcmpaginatedselectlist"></div>
  </div>
  <button type="submit">Apply</button>
</form>
<script>
  const SLOW = Number(new URLSearchParams(location.search).get('slow') || 0);
  const PLACEHOLDER_FIRST = new URLSearchParams(location.search).has('placeholderfirst');
  const all = ['No Selection', 'I am a protected veteran', 'I am a veteran but not a protected veteran',
               'I am not a protected veteran', 'I choose not to self-identify'];
  const NOLIST = new URLSearchParams(location.search).has('nolist');
  const CLOSES = new URLSearchParams(location.search).has('closes');
  let left = true;  // (the box left since its list last opened: the next opening closes again by itself)
  const closesNow = () => {
    if (!CLOSES || !left) return false;
    left = false;
    setTimeout(close, 300);  // (shown empty for a moment, then gone)
    return true;
  };
  const box = document.getElementById('51:_input');
  const list = document.getElementById(box.getAttribute('aria-owns'));
  const holder = list.parentElement;
  if (NOLIST) list.remove();
  let fetched = false, wanted = false;
  const draw = () => {
    const q = box.value.trim().toLowerCase();
    list.innerHTML = '';
    for (const name of all.filter((n) => !q || n.toLowerCase().includes(q))) {
      const o = document.createElement('div');
      o.setAttribute('role', 'option');
      o.textContent = name;
      o.addEventListener('mousedown', (e) => e.preventDefault());
      o.addEventListener('click', () => { box.value = name === 'No Selection' ? '' : name; close(); });
      list.append(o);
    }
  };
  const show = () => {
    wanted = true;
    if (NOLIST && !fetched) {  // (nothing drawn, nothing said, till the entries came)
      setTimeout(() => { fetched = true; if (wanted) show(); }, SLOW);
      return;
    }
    if (NOLIST && !list.isConnected) holder.append(list);
    list.classList.add('open');
    box.setAttribute('aria-expanded', 'true');
    if ((fetched || !SLOW) && closesNow()) { fetched = true; list.innerHTML = ''; return; }
    if (fetched || !SLOW) { fetched = true; draw(); return; }
    list.innerHTML = '';  // (the entries still on their way from the server)
    if (PLACEHOLDER_FIRST) {
      const o = document.createElement('div');
      o.setAttribute('role', 'option');
      o.textContent = 'No Selection';
      list.append(o);
    }
    setTimeout(() => { fetched = true; if (list.classList.contains('open') && !closesNow()) draw(); }, SLOW);
  };
  const close = () => {
    wanted = false;
    list.classList.remove('open');
    box.setAttribute('aria-expanded', 'false');
    if (NOLIST) list.remove();
  };
  box.addEventListener('click', show);
  document.getElementById('51:_selectButton').addEventListener('click', () => { box.focus(); show(); });
  box.addEventListener('keyup', (e) => { if (e.key === 'Escape') close(); else show(); });
  box.addEventListener('blur', () => { left = true; close(); });
  document.getElementById('apply').addEventListener('submit', (e) => {
    e.preventDefault();
    document.body.innerHTML = '<h1>Thank you for applying!</h1>';
  });
</script>
</body>
</html>
