<!doctype html>
<html>
<head><meta charset="utf-8"><title>Apply - Example Fab</title>
<style>
  #shade { position: fixed; inset: 0; background: rgba(0, 0, 0, .4); }
  #dlg { position: fixed; top: 20%; left: 20%; right: 20%; background: #fff; padding: 16px; }
</style>
</head>
<body>
<!-- An application's data-privacy statement, a dialog of its own over the form (as SuccessFactors draws its), with
     Accept and Decline, on a page whose footer speaks of cookies: its bare "Decline" is no cookie banner's (the review
     of Oct 15: the desk pressed it as "declined cookies", and the application went nowhere). -->
<h1>Application Form</h1>
<form id="app" onsubmit="event.preventDefault(); document.body.innerHTML = '<h1>Thank you for applying!</h1>';">
  <label for="fn">First Name *</label><input id="fn" required>
  <label for="ln">Last Name *</label><input id="ln" required>
  <label for="em">Email *</label><input id="em" type="email" required>
  <button type="submit">Submit application</button>
</form>
<footer><p>This site uses cookies. See our <a href="#">Cookie Policy</a>.</p></footer>
<div id="shade"></div>
<div id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
  <h2 id="dlg-title">Data Privacy Statement</h2>
  <p>Please read our data privacy statement. We process the personal data in your application to consider you for
     this position, as described in our privacy notice.</p>
  <button type="button" onclick="window.agreed = (window.agreed || 0) + 1; document.getElementById('dlg').remove(); document.getElementById('shade').remove();">Accept</button>
  <button type="button" onclick="window.declined = (window.declined || 0) + 1; document.body.innerHTML = '<h1>You must accept the data privacy statement to apply.</h1>';">Decline</button>
</div>
</body>
</html>
