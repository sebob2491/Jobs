<!doctype html>
<html>
<head><meta charset="utf-8"><title>Apply - Example Fab</title>
<style>
  .cookie-notice { position: fixed; left: 0; right: 0; bottom: 0; background: #222; color: #fff; padding: 8px; }
</style>
</head>
<body>
<!-- a cookie notice along the bottom edge, out of the form's way, with only "Got it" -->
<h1>Application Form</h1>
<form id="app" onsubmit="event.preventDefault(); document.body.innerHTML = '<h1>Thank you for applying!</h1>';">
  <label for="fn">First Name *</label><input id="fn" required>
  <label for="ln">Last Name *</label><input id="ln" required>
  <label for="em">Email *</label><input id="em" type="email" required>
  <button type="submit">Submit application</button>
</form>
<div class="cookie-notice">This site uses cookies.
  <button type="button" onclick="window.accepted = (window.accepted || 0) + 1; this.parentElement.remove();">Got it</button>
</div>
</body>
</html>
