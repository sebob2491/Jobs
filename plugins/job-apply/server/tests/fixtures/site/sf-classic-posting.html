<!doctype html>
<html>
<head><meta charset="utf-8"><title>Career Opportunities: Equipment Technician (ATA) (29107)</title></head>
<body>
<!-- like Amkor's posting pages on SuccessFactors' older career site (Oct 2026): the whole page
     sits in one form whose submit buttons are "Apply". The form holds hidden fields and a
     hidden "email this job to a friend" box, so pressing Apply opens the application. -->
<form id="careerform" name="careerform" action="sf-classic-signin.html" method="get">
  <input type="hidden" name="career_company" value="example">
  <input type="hidden" name="career_job_req_id" value="29107">
  <div><button type="button">Sign In</button></div>
  <h1>Career Opportunities: Equipment Technician (ATA) (29107)</h1>
  <div>Requisition ID 29107 - Posted 09/30/2026 - Engineering - Regular Non-Exempt Full-Time Employee</div>
  <div><button type="submit">Apply</button> <button type="button">Save Job</button>
    <button type="button">Email Job to Friend</button></div>
  <h2>Job Description</h2>
  <p>Maintain and repair packaging equipment at our Peoria, AZ factory.</p>
  <div><button type="submit">Apply</button></div>
  <div style="display:none">
    <label for="mail">Your friend's email address:</label><input id="mail" name="mailjob_friend_email" type="text">
    <textarea name="mailjob_message"></textarea>
  </div>
</form>
</body>
</html>
