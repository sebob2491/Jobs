<!doctype html>
<html>
<head><meta charset="utf-8"><title>Application</title></head>
<body>
<!-- a required self-identification list with no empty choice to start on: it opens on "Male", which no one chose;
     the profile's decline isn't one of its choices -->
<h1>Application</h1>
<form id="app" novalidate>
  <label for="fn">First Name</label><input id="fn" required>
  <label for="g">Gender</label>
  <select id="g" required><option>Male</option><option>Female</option></select>
  <button type="submit">Submit application</button>
</form>
</body>
</html>
