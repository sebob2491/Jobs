<!doctype html>
<html>
<head><meta charset="utf-8"><title>Energy Analyst - Example Utility</title></head>
<body>
<!-- A SuccessFactors posting whose "Apply now" opens a sign-in page good for one visit
     (career?_s.crb=<token>): opened again, it shows SuccessFactors' error (live, Oct 2026) -->
<h1>Energy Analyst</h1>
<p>Phoenix, AZ. Full time.</p>
<a href="#" id="apply">Apply now &raquo;</a>
<!-- ?menu: "Apply now" opens a menu whose own "Apply Now" goes on (EY's, Freeport's and SRP's career sites, nightly
     Oct 11) -->
<div id="menu" hidden><a href="#" id="apply-menu">Apply Now</a> <a href="#">Apply With LinkedIn</a></div>
<script>
  const go = () => {
    const home = new URLSearchParams(location.search).has('home') ? '&home' : '';
    location.href = 'signin-submit.html?reset=odd' + home + '&s=' + Math.random().toString(36).slice(2);
  };
  document.getElementById('apply-menu').addEventListener('click', (e) => { e.preventDefault(); go(); });
  document.getElementById('apply').addEventListener('click', (e) => {
    e.preventDefault();
    if (new URLSearchParams(location.search).has('menu')) {  // (the menu in its place)
      document.getElementById('menu').hidden = false;
      document.getElementById('apply').hidden = true;
      return;
    }
    const home = new URLSearchParams(location.search).has('home') ? '&home' : '';
    location.href = 'signin-submit.html?reset=odd' + home + '&s=' + Math.random().toString(36).slice(2);
  });
</script>
</body>
</html>
