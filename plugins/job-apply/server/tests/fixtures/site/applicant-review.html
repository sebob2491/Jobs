<!doctype html>
<html>
<head><meta charset="utf-8"><title>Review</title></head>
<body>
<!-- an application's review page on another of its addresses (Workday's myworkdaysite.com beside
     myworkdayjobs.com, Taleo's tbe.taleo.net beside taleo.net): the applicant's email in its box (?email=), and
     its Submit, which the live check's assessment taker must never press -->
<h2>Review</h2>
<label for="em">Email Address</label><input id="em" type="email">
<button type="button" id="send">Submit</button>
<script>
  document.getElementById('em').value = new URLSearchParams(location.search).get('email') || '';
  document.getElementById('send').addEventListener('click', () => { document.title = 'SENT'; });
</script>
</body>
</html>
