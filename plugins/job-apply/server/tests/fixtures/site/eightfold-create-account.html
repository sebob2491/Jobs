<!doctype html>
<html>
<head><meta charset="utf-8"><title>Apply</title></head>
<body>
<!-- An Eightfold site's sign-in modal over its application page (Northrop Grumman's, live, Oct 2026,
     read from its script; the site hides the password field, so an account is the email and an
     emailed code):
     1. "Sign in": the email, then Continue. An email it has no account for gets "We don't recognize
        this email. Create a new account", with "Create an account" below.
     2. "Create an account" opens "Please review before continuing": a box agreeing to the Privacy
        Policy, then Submit. ?contact=required: also a required "Contact Consent" with one choice,
        being considered for other open positions (Northrop's); ?contact=optional: the same, not
        required. ?late: its Submit is drawn a moment after its boxes (Northrop's, live).
     3. "Create an account": the email (kept from the sign-in), Continue. An email it has an account
        for gets "An account already exists with this email." (?exists).
     4. "Check your email": a box per digit of the emailed code (123456), Submit. Then the application
        (step1.html), with the account made in the tab's sessionStorage ("account"). -->
<h1>Careers</h1>
<div id="modal" role="dialog" aria-modal="true" title="Authentication" aria-labelledby="head">
  <button type="button" aria-label="Close candidate authentication modal"><svg width="12" height="12" aria-hidden="true"></svg></button>
  <div id="view"></div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const contact = params.get('contact');  // required | optional | (none)
  const view = document.getElementById('view');
  let email = '';
  let privacy = false;
  let chosen = false;

  function signIn(register) {
    view.innerHTML = '<h1 id="head">' + (register ? 'Create an account' : 'Sign in') + '</h1>'
      + '<label for="em">Email</label>'
      + '<input id="em" name="email" type="email" autocomplete="on" aria-errormessage="email-error-message">'
      + '<button type="button" aria-label="Clear email"><svg width="12" height="12" aria-hidden="true"></svg></button>'
      + '<p id="email-error-message" role="alert"></p>'
      + '<button type="button" id="go">Continue</button><span>OR</span>'
      + '<button type="button">' + (register ? 'Sign up' : 'Sign in') + ' using Google</button>'
      + '<div><span>' + (register ? 'Already have an account?' : 'First time here?') + '</span>'
      + '<button type="button" id="switch">' + (register ? 'Sign In' : 'Create an account') + '</button></div>';
    const box = document.getElementById('em');
    box.value = email;
    box.addEventListener('input', () => { email = box.value; });
    const say = (message) => {
      box.setAttribute('aria-invalid', 'true');
      document.getElementById('email-error-message').textContent = message;
    };
    document.getElementById('go').addEventListener('click', () => {
      if (!email) return say('Email cannot be left blank, Please enter a valid email in the format example@example.com');
      if (!register) return say("We don't recognize this email. Create a new account");
      if (params.has('exists')) return say('An account already exists with this email.');
      code();
    });
    document.getElementById('switch').addEventListener('click', () => (register ? signIn(false) : consent()));
  }

  function consent() {
    view.innerHTML = '<h2 id="head">Please review before continuing</h2>'
      + '<div><input id="consent-checkbox" type="checkbox" value="label" '
      + 'aria-label="I have read and agree to the Privacy Policy"><label for="consent-checkbox"><span></span></label>'
      + '<span>I have read and agree to the <a href="privacy.html" target="_blank">Privacy Policy'
      + '<span>(Opens in new window)</span></a></span></div>'
      + (contact ? '<div><p>Contact Consent</p><div aria-label="Contact Consent" data-testid="consent-radio-group">'
        + '<input id="contact-consent-choice-0" name="contact-consent-choice-0" type="radio" value="country_only" '
        + 'aria-label="I understand that I may be considered for other open positions in my country, in addition to '
        + 'the role(s) to which I apply"><label for="contact-consent-choice-0">I understand that I may be considered '
        + 'for other open positions in my country, in addition to the role(s) to which I apply</label></div></div>' : '')
      + '<p id="consent-error" role="alert"></p><span id="buttons"></span>';
    const agree = () => {
      document.getElementById('buttons').innerHTML = '<button type="button" id="agree">Submit</button>';
      document.getElementById('agree').addEventListener('click', submitted);
    };
    if (params.has('late')) setTimeout(agree, 1500); else agree();
    document.getElementById('consent-checkbox').addEventListener('change', (e) => { privacy = e.target.checked; });
    if (contact) document.getElementById('contact-consent-choice-0').addEventListener('change', () => { chosen = true; });
    function submitted() {
      const said = document.getElementById('consent-error');
      if (!privacy) { said.textContent = 'Please accept the privacy policy'; return; }
      if (contact === 'required' && !chosen) { said.textContent = 'You must select one option'; return; }
      signIn(true);
    }
  }

  function code() {
    view.innerHTML = '<h1 id="head">Check your email</h1><p>We just sent an email to ' + email + '.</p>'
      + '<fieldset><legend>Enter the code below</legend>'
      + [1, 2, 3, 4, 5, 6].map((i) => '<input class="digit" autocomplete="off" type="text" '
        + 'aria-label="Please enter OTP character ' + i + '">').join('')
      + '</fieldset><p id="otp-error" role="alert"></p>'
      + '<button type="button" id="confirm">Submit</button><p>Didn\'t receive it?</p>'
      + '<span>Check your spam folder or </span><button type="button" disabled>resend email (31s)</button>';
    const digits = [...document.querySelectorAll('.digit')];
    digits.forEach((el) => el.addEventListener('input', () => {
      // react-otp-input: one character a box, or a whole code put in one box spread across them
      const typed = el.value;
      if (typed.length === digits.length) digits.forEach((d, i) => { d.value = typed[i]; });
      else el.value = typed.slice(-1);
    }));
    document.getElementById('confirm').addEventListener('click', () => {
      if (digits.map((d) => d.value).join('') !== '123456') {
        document.getElementById('otp-error').textContent = 'Failed to verify code. Please try again later.';
        return;
      }
      sessionStorage.setItem('account', email);
      location.href = 'step1.html';
    });
  }

  signIn(false);
</script>
</body>
</html>
