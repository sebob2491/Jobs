[project]
name = "job-apply"
version = "0.3.0"
description = "MCP server that ingests job postings, tracks applications, and fills application forms in a real browser."
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",
    "playwright>=1.51",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3.5"]

[project.scripts]
job-apply-mcp = "job_apply.server:main"
job-apply-desk = "job_apply.desk:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_apply"]

[tool.pytest.ini_options]
testpaths = ["tests"]
