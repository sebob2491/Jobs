name: live-smoke

# Read-only check of the plugin against real employer career sites, with a fake
# profile and submitting disabled (see plugins/job-apply/server/scripts/live_smoke.py).
# Runs on demand only (no longer on every push, where it showed a skipped check on each
# commit: the review of Oct 15). The fixtures input captures the pages it stops on,
# scrubbed, into the run's artifact: they're imported with
# `scripts/nightly_summary.py --import-fixtures` and looked over before a commit, never
# committed by the run itself (the repo is public). The pipeline input runs the Job Desk's
# one-button pipeline on one posting per company instead.

on:
  workflow_dispatch:
    inputs:
      companies:
        description: Comma-separated company names (blank for all)
        required: false
        default: ""
      fixtures:
        description: Capture the scrubbed pages it stops on into the artifact (import them by hand, after a look)
        type: boolean
        default: false
      pipeline:
        description: Run the one-button apply pipeline instead of the field check
        type: boolean
        default: false
      fake_passwords:
        description: With pipeline, a throwaway saved password per job system (one sign-in try, then Create Account filled in; never created)
        type: boolean
        default: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: plugins/job-apply/server
    env:
      JOB_APPLY_NEVER_SUBMIT: "1"
      FIXTURES: ${{ inputs.fixtures }}
      PIPELINE: ${{ inputs.pipeline }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: plugins/job-apply/server/uv.lock
      - run: uv sync --frozen
      - run: uv run --frozen playwright install --with-deps chromium
      - name: Run live smoke test
        env:
          COMPANIES: ${{ inputs.companies }}
          FAKE_PASSWORDS: ${{ inputs.fake_passwords }}
        run: |
          args=(--out live-report)
          if [ -n "$COMPANIES" ]; then args+=(--companies "$COMPANIES"); fi
          if [ "$FIXTURES" = "true" ]; then args+=(--fixtures); fi
          if [ "$PIPELINE" = "true" ]; then args+=(--pipeline); fi
          if [ "$FAKE_PASSWORDS" = "true" ]; then args+=(--fake-passwords); fi
          uv run --frozen python scripts/live_smoke.py "${args[@]}"
      - name: Summary
        if: always()
        run: cat live-report/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-report
          path: plugins/job-apply/server/live-report
          retention-days: 14
