name: windows installer

# JobDeskSetup.exe, the Job Desk's double-click installer for Windows (plugins/job-apply/setup/windows, the owner's
# choice of Nov 2): built with Inno Setup at the plugin's version, uploaded as an artifact, then installed silently
# here, as a person's double-click would, and checked: the installed doctor finds nothing wrong but a clean
# computer's (no job-apply folder, profile or resume yet), the Start menu's Job Desk starts the desk and it answers on
# its port, a second start opens that desk rather than a second one, and the uninstaller takes away the program and
# its shortcuts, never the person's job-apply folder. Then it's published: attached, with its sha256 beside it, to
# that version's GitHub Release, which the README's download link and the desk's Update button read (releases/latest).
# Every version publishes itself: a push to main that changes the plugin's manifest (each version bumps it) runs
# this, as does a tag job-apply-v*, which must name the manifest's version. An installer already published is never
# replaced by a push: only by a run by hand with `release` ticked (a push adds the sha256 to one that's out without
# it, worked out from the installer that's out). A Release is made with its files, so it's never out empty, and the
# latest Release stays the newest version's, checked at the end. Not signed yet: Windows' SmartScreen asks "More
# info", "Run anyway" (the README says so).
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish it: the GitHub Release job-apply-v<the plugin's version>, made at this commit"
        type: boolean
        default: false
  push:
    tags: ["job-apply-v*"]
    # (and every version: each bumps the manifest. Paths aren't looked at for a tag's push)
    branches: [main]
    paths: ["plugins/job-apply/.claude-plugin/plugin.json"]

permissions:
  contents: read

# One run that publishes at a time (its last step looks at the Release, then adds to it): the others wait their turn,
# every one of them (`queue: max`; GitHub's own way is to keep the newest waiting and cancel the rest). A run by hand
# that publishes nothing (a try of the build) has a group of its own and waits for nobody.
concurrency:
  group: ${{ (github.event_name == 'push' || inputs.release) && 'windows-installer-publish' || format('windows-installer-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:
  installer:
    name: JobDeskSetup.exe (build, install, uninstall)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write  # (the Release, for a push or `release`)
    defaults:
      run:
        shell: pwsh
    env:
      # Inno Setup, pinned: its sha256 is the one its own signature file (innosetup-<version>.exe.issig) gives
      INNO_VERSION: "6.7.3"
      INNO_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Inno Setup ${{ env.INNO_VERSION }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $exe = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_VERSION.exe"
          $tag = 'is-' + $env:INNO_VERSION.Replace('.', '_')
          Invoke-WebRequest -UseBasicParsing -OutFile $exe `
            -Uri "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$env:INNO_VERSION.exe"
          $got = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLower()
          if ($got -ne $env:INNO_SHA256) { throw "Inno Setup's sha256 is $got, not the pinned $env:INNO_SHA256" }
          $dir = Join-Path $env:RUNNER_TEMP 'inno'
          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES',
            '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=`"$dir`"")
          if ($p.ExitCode -ne 0 -or -not (Test-Path -LiteralPath "$dir\ISCC.exe")) {
            throw "Inno Setup didn't install (exit $($p.ExitCode))"
          }
          "ISCC=$dir\ISCC.exe" >> $env:GITHUB_ENV
      - name: Build JobDeskSetup.exe
        run: ./plugins/job-apply/setup/windows/build.ps1 -Iscc $env:ISCC
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: JobDeskSetup
          path: plugins/job-apply/setup/windows/Output/JobDeskSetup.exe
          if-no-files-found: error

      - name: Install it silently, as a person would by double-clicking
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'setup.log'
          $p = Start-Process -FilePath plugins/job-apply/setup/windows/Output/JobDeskSetup.exe -Wait -PassThru `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', "/LOG=`"$log`"")
          Get-Content -LiteralPath $log -Tail 60
          if ($p.ExitCode -ne 0) { throw "Setup exited $($p.ExitCode)" }
          if (Select-String -LiteralPath $log -Pattern 'The Job Desk is installed, but' -SimpleMatch -Quiet) {
            throw 'Setup said a step after copying the files failed (above)'
          }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\JobDesk'  # per-user: no administrator
          $server = "$app\plugin\server"
          foreach ($f in @("$app\bin\uv.exe", "$app\bin\uvw.exe", "$app\unins000.exe", "$app\plugin\.mcp.json",
                           "$app\plugin\.claude-plugin\plugin.json", "$server\pyproject.toml", "$server\uv.lock",
                           "$server\src\job_apply\static\desk.html", "$server\.venv\pyvenv.cfg")) {
            if (-not (Test-Path -LiteralPath $f)) { throw "Not installed: $f" }
          }
          if (Test-Path -LiteralPath "$server\tests") { throw 'The tests (and their fixtures) were carried' }
          $python = [Environment]::GetEnvironmentVariable('UV_PYTHON_INSTALL_DIR', 'User')
          if (-not $python -or $python -match '\\AppData\\') { throw "UV_PYTHON_INSTALL_DIR is '$python'" }
          "APP=$app" >> $env:GITHUB_ENV
          "SERVER=$server" >> $env:GITHUB_ENV
          "UV_PYTHON_INSTALL_DIR=$python" >> $env:GITHUB_ENV  # (as a program started after setup sees it)

      - name: The installed doctor (without --launch)
        run: |
          $ErrorActionPreference = 'Stop'
          # (uv on the PATH, as the doctor's check of it asks: the Claude app starts the plugin with it)
          $env:PATH = "$env:APP\bin;$env:PATH"
          $out = & "$env:APP\bin\uv.exe" run --quiet --frozen --python 3.13 --project $env:SERVER job-apply-doctor --json
          $code = $LASTEXITCODE
          $report = ($out | Out-String) | ConvertFrom-Json
          foreach ($c in $report.checks) { '{0,-8} {1}: {2}' -f $c.status, $c.name, $c.say }
          $problems = @($report.checks | Where-Object { $_.status -eq 'problem' } | ForEach-Object { $_.name })
          # a clean computer's: no job-apply folder, profile or resume yet (the desk's setup asks for them)
          $unexpected = @($problems | Where-Object { $_ -notin @('folder', 'profile', 'resume') })
          if ($unexpected.Count -gt 0) { throw "The doctor found problems a fresh install shouldn't have: $unexpected" }
          foreach ($name in @('python', 'uv', 'plugin', 'browser', 'uv_python_dir')) {
            if (-not ($report.checks | Where-Object { $_.name -eq $name })) { throw "The doctor's report lacks $name" }
          }
          if ($code -ne $(if ($problems.Count -gt 0) { 1 } else { 0 })) { throw "The doctor exited $code" }
          # (the doctor's 1, for a clean computer's three, isn't this step's: the runner ends a step with the last
          # program's exit code)
          $global:LASTEXITCODE = 0

      - name: The Start menu's Job Desk starts the desk, and a second start opens it
        run: |
          $ErrorActionPreference = 'Stop'
          $programs = [Environment]::GetFolderPath('Programs')
          $lnk = (New-Object -ComObject WScript.Shell).CreateShortcut((Join-Path $programs 'Job Desk.lnk'))
          if ($lnk.TargetPath -ne "$env:APP\bin\uvw.exe" -or $lnk.Arguments -notmatch 'job-apply-desk$') {
            throw "The shortcut runs: $($lnk.TargetPath) $($lnk.Arguments)"
          }
          Start-Process -FilePath $lnk.TargetPath -ArgumentList "$($lnk.Arguments) --no-browser" `
            -WorkingDirectory $lnk.WorkingDirectory
          $page = $null
          for ($i = 0; $i -lt 90 -and -not $page; $i++) {
            try { $page = Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 -Uri 'http://127.0.0.1:8765/' } catch { Start-Sleep 2 }
          }
          if (-not $page -or $page.StatusCode -ne 200 -or $page.Content -notmatch '<title>Job Desk</title>') {
            throw "The desk didn't answer on port 8765"
          }
          $folder = Join-Path $HOME '.job-apply'
          if (-not (Test-Path -LiteralPath "$folder\desk_watch_8765.json")) { throw 'No watch file for the desk' }
          $said = Join-Path $env:RUNNER_TEMP 'second.txt'
          $second = Start-Process -FilePath "$env:APP\bin\uv.exe" -NoNewWindow -PassThru -RedirectStandardOutput $said `
            -ArgumentList "run --quiet --frozen --python 3.13 --project `"$env:SERVER`" job-apply-desk --no-browser"
          if (-not $second.WaitForExit(120000)) { $second.Kill(); throw 'A second start served a second desk' }
          Get-Content -LiteralPath $said
          if (-not (Select-String -LiteralPath $said -Pattern 'already running' -SimpleMatch -Quiet)) {
            throw "A second start didn't open the desk already running"
          }
          if (@(Get-ChildItem -LiteralPath $folder -Filter 'desk_watch_*.json').Count -ne 1) { throw 'Two desks run' }
          Set-Content -LiteralPath "$folder\keep-me.txt" -Value 'the person''s own' -Encoding utf8

      - name: The desk's own window outlives the start that opened it
        # The desk opens in a window of the person's own Edge (0.4.0: window.py). If Edge wasn't running, the Edge
        # started there is the person's whole browser from then on, so it must not go down with the program that
        # started it (uv's launcher holds what it starts in a job: the review of Nov 9 couldn't check that from
        # Linux). A second start, as the Start menu makes it, opens the running desk's window and ends: the browser
        # it started has to be there after it. Where no browser comes up on this machine at all, that's said and
        # nothing is checked (it isn't the installer's to fail for).
        run: |
          $ErrorActionPreference = 'Stop'
          $programs = [Environment]::GetFolderPath('Programs')
          $lnk = (New-Object -ComObject WScript.Shell).CreateShortcut((Join-Path $programs 'Job Desk.lnk'))
          $before = @(Get-Process -Name msedge -ErrorAction SilentlyContinue | ForEach-Object { $_.Id })
          $start = Start-Process -FilePath $lnk.TargetPath -ArgumentList $lnk.Arguments `
            -WorkingDirectory $lnk.WorkingDirectory -PassThru
          $came = @()
          for ($i = 0; $i -lt 45 -and $came.Count -eq 0; $i++) {
            Start-Sleep 2
            $came = @(Get-Process -Name msedge -ErrorAction SilentlyContinue | Where-Object { $_.Id -notin $before })
          }
          if (-not $start.WaitForExit(120000)) { $start.Kill(); throw "A start that found the desk running didn't end" }
          if ($came.Count -eq 0) {
            Write-Host "::warning::No browser came up for the desk's window on this machine: not checked"
          } else {
            Start-Sleep 15
            $still = @(Get-Process -Name msedge -ErrorAction SilentlyContinue | Where-Object { $_.Id -notin $before })
            Write-Host "Edge processes the window started: $($came.Count); there 15 s after the start ended: $($still.Count)"
            if ($still.Count -eq 0) { throw "The desk's window went down with the program that started it" }
            $still | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          if (@(Get-ChildItem -LiteralPath (Join-Path $HOME '.job-apply') -Filter 'desk_watch_*.json').Count -ne 1) {
            throw 'Two desks run'
          }

      - name: An update started by the desk replaces it and brings it back
        # The desk's Update button (updates.py) starts the new version's installer and stops; the installer stops what
        # still runs from the program's folder (stop-desk.ps1), installs, and opens the desk again. The processes it
        # stops include the one that started it, and if they held it in a job that ends with them, the installer would
        # go down too (the review of Nov 10 couldn't check that from Linux). So the installer just built is started
        # here the way the desk starts it, with the code's own function (updates.start_installer), from the installed
        # program's Python run through its uvw.exe as the Start menu's shortcut runs the desk (so stop-desk.ps1 stops
        # it too), while the desk the steps before started runs. Then, within 3 minutes: the installer's log says the
        # install finished, a new desk answers on the port the watch file names, and the starter is gone. Where
        # Windows won't start the installer outside the starter's job, the desk's update fails with its sentence and
        # starts nothing (updates.NO_BREAKAWAY), and so does this step, at once, saying so.
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $HOME '.job-apply'
          $updates = Join-Path $folder 'updates'
          New-Item -ItemType Directory -Force -Path $updates | Out-Null
          $exe = (Resolve-Path -LiteralPath 'plugins/job-apply/setup/windows/Output/JobDeskSetup.exe').Path
          $log = Join-Path $updates 'install-ci.log'
          $starterId = Join-Path $env:RUNNER_TEMP 'starter.pid'
          $starterSaid = Join-Path $env:RUNNER_TEMP 'starter.txt'
          Remove-Item -LiteralPath $log, $starterId, $starterSaid -ErrorAction SilentlyContinue
          # the desk running now (the steps before started it): the watch file names its process and port
          $watch = Join-Path $folder 'desk_watch_8765.json'
          $before = Get-Content -Raw -LiteralPath $watch | ConvertFrom-Json
          Write-Host "The desk before the update: process $($before.pid), port $($before.port)"
          # the starter: it writes its own process id, starts the installer as the Update button does (out of its own
          # job, uvw.exe's, or not at all), says which, and waits to be stopped (the desk itself would stop once the
          # installer had taken over). uvw.exe has no console, so what it says is also written to a file, for this
          # step to say again
          $script = Join-Path $env:RUNNER_TEMP 'start_update.py'
          Set-Content -LiteralPath $script -Encoding utf8 -Value @'
          import os
          import sys
          import time
          from pathlib import Path

          from job_apply import updates, window

          Path(sys.argv[3]).write_text(str(os.getpid()), encoding="utf-8")
          try:
              updates.start_installer(Path(sys.argv[1]), Path(sys.argv[2]))
              said, refused = "The installer was started out of the starter's job.", False
          except window.BreakawayRefused:
              said, refused = "Refused: Windows wouldn't start the installer outside the starter's job, so the desk's Update button would fail here and start nothing.", True
          print(said, flush=True)
          Path(sys.argv[4]).write_text(said, encoding="utf-8")
          if refused:
              sys.exit(1)
          time.sleep(600)
          '@
          Start-Process -FilePath "$env:APP\bin\uvw.exe" -WorkingDirectory $env:SERVER -ArgumentList (
            "run --frozen --python 3.13 --project `"$env:SERVER`" python `"$script`" `"$exe`" `"$log`" `"$starterId`" `"$starterSaid`"")
          $finished = $false
          $answers = $false
          $gone = $false
          $refused = $false
          $id = $null
          $now = $null
          $deadline = (Get-Date).AddMinutes(3)
          while ((Get-Date) -lt $deadline -and -not ($finished -and $answers -and $gone)) {
            Start-Sleep 3
            # (Windows refused to start it outside the starter's job: nothing was started, nothing to wait for)
            if ((Test-Path -LiteralPath $starterSaid) -and (Select-String -LiteralPath $starterSaid -Pattern 'Refused: ' -SimpleMatch -Quiet)) {
              $refused = $true
              break
            }
            if (-not $id -and (Test-Path -LiteralPath $starterId)) { $id = [int](Get-Content -Raw -LiteralPath $starterId) }
            if ($id) { $gone = -not (Get-Process -Id $id -ErrorAction SilentlyContinue) }
            if (-not $finished -and (Test-Path -LiteralPath $log)) {
              # (the line JobDeskSetup.iss logs once the install has finished, at ssDone)
              try { $finished = [bool](Select-String -LiteralPath $log -Pattern 'Job Desk: the install finished.' -SimpleMatch -Quiet) } catch { }
            }
            if ($finished -and -not $answers -and (Test-Path -LiteralPath $watch)) {
              try {
                # a desk of its own: the watch file names another process than the one before
                $now = Get-Content -Raw -LiteralPath $watch | ConvertFrom-Json
                if ($now.pid -ne $before.pid) {
                  $page = Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 -Uri "http://127.0.0.1:$($now.port)/"
                  $answers = $page.StatusCode -eq 200 -and $page.Content -match '<title>Job Desk</title>'
                }
              } catch { }
            }
          }
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 40 }
          # how the installer was started: out of the starter's job, or not at all (this step fails then)
          $how = "The starter didn't say how it started the installer."
          if (Test-Path -LiteralPath $starterSaid) { $how = (Get-Content -Raw -LiteralPath $starterSaid).Trim() }
          Write-Host "Starter: $how"
          if ($refused) { throw "Starter: $how" }
          $missing = @()
          if (-not $id) { $missing += 'The starter never ran: it wrote no process id, so the installer was never started' }
          if (-not $finished) { $missing += "The installer's log doesn't say the install finished (it was stopped, or failed: its log is above)" }
          if (-not $answers) { $missing += 'No new desk answered on its port after the update' }
          if ($id -and -not $gone) { $missing += "The process that started the installer ($id) still runs: stop-desk.ps1 didn't stop it" }
          if ($missing.Count -gt 0) { throw ($missing -join '. ') }
          Write-Host "Updated: the installer finished, a new desk (process $($now.pid)) answers on port $($now.port), and the starter ($id) is gone. $how"

      - name: Uninstall silently; the person's job-apply folder stays
        run: |
          $ErrorActionPreference = 'Stop'
          $null = Start-Process -FilePath "$env:APP\unins000.exe" -Wait -PassThru `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES')
          # (the uninstaller hands over to a copy of itself in the temp folder: wait for the program's folder to go)
          for ($i = 0; $i -lt 90 -and (Test-Path -LiteralPath $env:APP); $i++) { Start-Sleep 2 }
          if (Test-Path -LiteralPath $env:APP) {
            Get-ChildItem -LiteralPath $env:APP -Recurse | Select-Object -First 30 -ExpandProperty FullName
            throw "$env:APP is still there"
          }
          if (Test-Path -LiteralPath (Join-Path ([Environment]::GetFolderPath('Programs')) 'Job Desk.lnk')) {
            throw "The Start menu's shortcut is still there"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $HOME '.job-apply\keep-me.txt'))) {
            throw "The uninstaller took the person's job-apply folder"
          }
          $answers = $true
          try { $null = Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 -Uri 'http://127.0.0.1:8765/' } catch { $answers = $false }
          if ($answers) { throw 'The desk still runs after uninstalling' }

      - name: Attach it to the version's GitHub Release
        if: github.event_name == 'push' || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -Raw -Encoding UTF8 plugins/job-apply/.claude-plugin/plugin.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+(\.\d+)+$') { throw "The plugin's version, $version, isn't numbers and dots" }
          $tag = "job-apply-v$version"
          # a tag names the version it publishes: a mistyped one never puts an installer under another number
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "The tag $env:GITHUB_REF_NAME isn't $tag, the plugin's version"
          }
          # An installer's sha256 beside it, as sha256sum writes one (the digest, two spaces, the name, a line end):
          # the desk's Update button checks a download against it
          function Write-Sum([string]$file) {
            $sum = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLower()
            Set-Content -LiteralPath "$file.sha256" -Value "$sum  JobDeskSetup.exe`n" -NoNewline -Encoding ascii
            Get-Content -LiteralPath "$file.sha256" | Write-Host
          }
          $byHand = $env:GITHUB_EVENT_NAME -ne 'push'
          $exe = 'plugins/job-apply/setup/windows/Output/JobDeskSetup.exe'
          # The Release as it is: there or not, and the files it holds
          $draft = gh release view $tag --json isDraft --jq '.isDraft' 2>$null
          $there = $LASTEXITCODE -eq 0
          if ($there -and $draft -eq 'true') {
            # a draft isn't out, and isn't this step's to finish or to take away: one a person began (its notes
            # written ahead), or one left by a run that was stopped while making the Release
            throw "There's a draft Release for $tag. Publish it or delete it on GitHub's Releases page, then run this again"
          }
          $names = @()
          if ($there) {
            $names = @(gh release view $tag --json assets --jq '.assets[].name')
            if ($LASTEXITCODE -ne 0) { throw "Couldn't read the Release $tag" }
          }
          if (($names -contains 'JobDeskSetup.exe') -and -not $byHand) {
            # An installer already published is never replaced by a push: only by a run by hand with `release` ticked
            if ($names -contains 'JobDeskSetup.exe.sha256') {
              Write-Host "$tag already has its installer, left as it is"
            } else {
              # out without its sha256 (published before these were written, or an upload cut short): the sum of
              # the installer that is out, the one people have, never this build's
              $was = Join-Path $env:RUNNER_TEMP 'published'
              New-Item -ItemType Directory -Force -Path $was | Out-Null
              gh release download $tag --pattern 'JobDeskSetup.exe' --dir $was
              if ($LASTEXITCODE -ne 0) { throw "Couldn't download the installer $tag has" }
              $published = Join-Path $was 'JobDeskSetup.exe'
              Write-Sum $published
              gh release upload $tag "$published.sha256"
              if ($LASTEXITCODE -ne 0) { throw "Couldn't attach the sha256 to $tag" }
            }
          } else {
            Write-Sum $exe
            if (-not $there) {
              # made with its files: gh keeps the Release a draft until both are up, and takes it away if they don't
              # get there, so it's never out empty (the README's link would lead nowhere)
              gh release create $tag $exe "$exe.sha256" --target $env:GITHUB_SHA --title "job-apply $version" `
                --notes "JobDeskSetup.exe: the Job Desk for Windows. Download it, double-click it (Windows may say it protected your PC: More info, then Run anyway), and open the Job Desk from the Start menu."
              if ($LASTEXITCODE -ne 0) { throw "Couldn't make the Release $tag" }
            } else {
              # there already: with no installer yet (nothing of one to replace), or this is a run by hand with
              # `release` ticked, which may replace what's out
              gh release upload $tag $exe "$exe.sha256" --clobber
              if ($LASTEXITCODE -ne 0) { throw "Couldn't attach the installer to $tag" }
            }
          }
          # The latest Release is the newest version's: the README's link and the desk's Update button read it. GitHub
          # marks a Release made just now as the latest whatever its number, so the newest is marked, every time (this
          # run's own is among them whatever the list says: the list can trail what was just made). Then it's checked,
          # a few times over (GitHub's answer can be a moment behind too)
          $tags = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft | not) | .tag_name')
          if ($LASTEXITCODE -ne 0) { throw "Couldn't list the Releases" }
          $newest = (@($tags) + $tag) | Where-Object { $_ -match '^job-apply-v\d+(\.\d+)+$' } |
            Sort-Object { [version]($_ -replace '^job-apply-v', '') } | Select-Object -Last 1
          gh release edit $newest --latest
          if ($LASTEXITCODE -ne 0) { throw "Couldn't mark $newest as the latest Release" }
          $latest = ''
          foreach ($look in 1..10) {
            $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name'
            if ($LASTEXITCODE -eq 0 -and $latest -eq $newest) { break }
            Start-Sleep -Seconds 3
          }
          if ($latest -ne $newest) { throw "The latest Release is $latest, not $newest, the newest version's" }
