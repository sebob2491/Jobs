name: tests

# Once per change: on pull requests (whose checks main's ruleset requires) and on main itself.
# A push to a branch with a pull request open ran the same jobs a second time.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    # the suite in two parts on separate machines (tests/conftest.py splits it by test id),
    # about two minutes each instead of four or five on one
    name: tests (Python ${{ matrix.python }}, part ${{ matrix.part }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        part: [1, 2]
    defaults:
      run:
        working-directory: plugins/job-apply/server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: plugins/job-apply/server/uv.lock
      - run: uv sync --frozen --extra dev
      - name: Lint (ruff)
        if: matrix.part == 1
        run: uv run --frozen ruff check --output-format=github .
      - name: Type check (mypy)
        if: matrix.part == 1
        run: uv run --frozen mypy src/job_apply
      - run: uv run --frozen playwright install --with-deps chromium
      - run: uv run --frozen pytest -q -n auto
        env:
          JOB_APPLY_TEST_SHARD: ${{ matrix.part }}/2

  windows:
    # The same suite on Windows, where the owner runs the plugin (Claude's desktop app). Not one
    # of the checks main's ruleset requires (server below doesn't wait for it): a failure here is
    # for a person to look at. No PYTHONUTF8: Python on Windows writes a file without an encoding
    # as cp1252 there, as it will on the owner's computer, so a missing encoding="utf-8" shows.
    name: windows (Python 3.13, part ${{ matrix.part }}/2)
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    defaults:
      run:
        shell: bash
        working-directory: plugins/job-apply/server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: plugins/job-apply/server/uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen playwright install chromium
      - name: The tests find the browser (else every browser test would be skipped, not failed)
        run: uv run --frozen python -c "import sys; sys.path.insert(0, 'tests'); from conftest import browser_available; sys.exit(not browser_available())"
      - run: uv run --frozen pytest -q -n auto
        env:
          JOB_APPLY_TEST_SHARD: ${{ matrix.part }}/2

  server:
    # The checks main's ruleset requires, by these names: green only when every part passed.
    # (Run always: a skipped required check would count as passed.)
    name: server (Python ${{ matrix.python }})
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - name: Every part of the suite passed
        run: test "${{ needs.tests.result }}" = success

  plugin:
    name: plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict plugins/job-apply
      - run: claude plugin validate --strict plugins/dev-kit
