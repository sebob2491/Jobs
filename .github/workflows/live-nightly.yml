name: live-nightly

# Every night, the live check of plugins/job-apply/server/scripts/live_smoke.py (a fake
# profile, submitting disabled), compared with the night before by scripts/live_compare.py:
#   - the Job Desk pipeline on one posting per employer of the default semiconductor list:
#     where it ended ("ready", "needs_you sign_in", "needs_you stuck", ...);
#   - the same for HR jobs on the phoenix-metro list, as an applicant with an HR background,
#     and for finance jobs there, as an applicant with a finance background (paused: the owner's call, Oct
#     10, "put all finance on the back burner"; its last results stay in the issue as they were);
#   - the search check on both lists: whether each employer's search works (how many openings
#     it finds changes daily, and is never compared; the semiconductor list since Oct 16, 2026);
#   - the accounts check: the pipeline as the test identity (a clearly fake applicant with an
#     inbox of its own; the owner's call, Oct 10) at every employer on both lists (--everywhere:
#     the owner's call, Oct 11): it makes their accounts and reads their emailed
#     codes, and never submits. It runs only once the repository has the test identity's three
#     secrets (scripts/TEST_IDENTITY.md); until then it says "not set up" and stays green.
# The issue titled "Nightly live check" (label live-check) holds the last results in its body.
# It gets a comment only when an employer's result changes, its review page's form changes or it takes twice
# its usual time (scripts/live_compare.py's "changes" output counts them all); on a quiet night only its body's
# "Last checked" line and tables are rewritten, which notifies no one. A run whose check
# didn't finish fails (employers it didn't reach keep their last result). And a second comment, "Needs a person",
# only when something does (scripts/nightly_summary.py --digest: an employer went backwards, a check didn't finish,
# an employer desk_handled.yaml lists is out of "all the way" for two runs, the test inbox refused its login, the
# weekly probes found a desk failure).
# A second issue, "Nightly live trends" (label live-trends, never live-check: the steps here find the first
# issue by that label and its title), keeps the history: the last 60 runs' counts per check, each employer's
# last 20 runs, and the employers whose result keeps flipping. Its body is rewritten, never commented on.
# Only runs of the default branch write to the issues: a manual run from another branch shows
# its comparison in the job summary only.
# The four checks (finance is paused) run at once, each on a machine of its own (a fraction of the time they took
# one after another); the compare job then reads their logs.
# A manual run can be a probe of a few employers or checks (its inputs): it runs only those, and
# isn't compared or written to the issue; its artifacts hold the results
# (scripts/nightly_summary.py --artifacts reads them).
# Once a week (Sundays, and by hand with checks "probes"), the weekly probes (scripts/live_probes.py), as the test
# identity and never submitting: the desk's password reset at two Workday tenants (a pass with a saved password derived
# from the real one, which the site refuses and the desk resets the site to, then a pass with the real one, which
# resets it back) and a tailored resume in the job's folder (does the review page show it, not the profile's?). They
# run here, in this workflow's concurrency group, so never beside another run on the test inbox or its accounts, and
# after this run's checks when a manual run asks for both. Their results: the run's summary and its live-probes
# artifact (scripts/nightly_summary.py --probes reads it). Only a desk failure fails the run (a pass 2 that didn't
# restore the real password always does); a probe the site or the person stopped (a bot check, a CAPTCHA, a site's
# error page, no posting) is said under "Couldn't check this week", and the run stays green.

on:
  # GitHub starts this schedule hours late (5 to 10, Oct 2026), so a routine dispatches the run at 3:17 AM in Arizona
  # instead (the owner's call, Oct 13), and a run is dispatched after each release. The schedule stays as a fallback:
  # a scheduled run skips itself when a full run was written to the issue in the last 12 hours (the "fresh" job).
  schedule:
    - cron: "17 10 * * *"  # 3:17 AM in Arizona (UTC-7 all year)
    # the weekly probes alone (the "fresh" job's WEEKLY: the same string), Sundays at 6:43 AM in Arizona, hours after
    # the 3:17 run has finished
    - cron: "43 13 * * 0"
  workflow_dispatch:
    inputs:
      companies:
        description: "Only these employers (comma-separated, as live_smoke.py --companies): a probe, not compared"
        required: false
        default: ""
      checks:
        description: "Only these checks (comma-separated: pipeline, hr, search, accounts, probes): a probe, not compared"
        required: false
        default: ""
      plus:
        description: "The accounts check with the test inbox's own +employer address at each employer (which sites take one): a probe, not compared"
        type: boolean
        required: false
        default: false

concurrency:
  group: live-nightly
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  # A scheduled run that a dispatched full run has already done today's work for (its "Last checked" in the issue
  # within 12 hours) runs nothing: two full runs a day would make the test identity's accounts twice. A dispatched
  # run always goes ahead. "go": the nightly's checks run; "probes": the weekly probes run (the weekly schedule's run,
  # which runs nothing else, or a manual run whose checks name them).
  fresh:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.last.outputs.go }}
      probes: ${{ steps.last.outputs.probes }}
    steps:
      - name: When the issue was last written
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SCHEDULE: ${{ github.event.schedule }}
          CHECKS: ${{ github.event.inputs.checks }}
          WEEKLY: "43 13 * * 0"  # (the weekly probes' schedule, as written under "on")
        run: |
          if [ "$EVENT" = schedule ] && [ "$SCHEDULE" = "$WEEKLY" ]; then
            echo "The weekly probes' run: the probes alone (scripts/live_probes.py)." >> "$GITHUB_STEP_SUMMARY"
            { echo "go=false"; echo "probes=true"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" != schedule ]; then
            checks=",${CHECKS// /},"
            if [[ "$checks" == *,probes,* ]]; then echo "probes=true"; else echo "probes=false"; fi >> "$GITHUB_OUTPUT"
            # (a manual run of the probes alone runs none of the nightly's checks)
            if [ "${checks//,probes,/,}" = "," ] && [ -n "${CHECKS// /}" ]; then echo "go=false"; else echo "go=true"; fi \
              >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "probes=false" >> "$GITHUB_OUTPUT"
          # (by its title too: the trend issue, "Nightly live trends", never has its label, but nothing else may count)
          body=$(gh issue list --repo "$REPO" --label live-check --state open --limit 10 --json title,body \
            --jq '[.[] | select(.title == "Nightly live check")][0].body // ""' || true)
          last=$(printf '%s' "$body" | sed -n 's/^Last checked: \([0-9-]* [0-9:]*\) UTC.*/\1/p' | head -1)
          if [ -n "$last" ] && [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -lt 43200 ]; then
            echo "A full run was written to the issue at $last UTC, within 12 hours: this late scheduled run skips." >> "$GITHUB_STEP_SUMMARY"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: fresh
    if: needs.fresh.outputs.go == 'true'
    name: ${{ matrix.slot || matrix.check }} check
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.check == 'accounts' && 120 || 60 }}
    strategy:
      fail-fast: false  # each check reports on its own; one that fails leaves its employers' last results
      matrix:
        include:
          - check: pipeline  # the Job Desk pipeline, semiconductor list
            args: --pipeline --fake-passwords --parallel 4 --fixtures
            minutes: 35
          - check: hr  # HR jobs, phoenix-metro list
            args: --pipeline --fake-passwords --parallel 4 --lists phoenix-metro --role hr --fixtures
            minutes: 45
          # finance jobs, phoenix-metro list: paused (the owner's call, Oct 10). To resume, put back:
          # - check: finance
          #   args: --pipeline --fake-passwords --parallel 4 --lists phoenix-metro --role finance
          #   minutes: 30
          - check: search  # whether each employer's search works, on both lists
            args: --lists phoenix-metro,semiconductor-az --parallel 4
            minutes: 30
          # (each application goes as far as the rules let it: up to 5 minutes a round, more rounds and one Resume, the
          # owner's call, Oct 13; the minutes leave room for that)
          # the test identity, its accounts made, at every employer on both lists (the owner's call, Oct 11), on three
          # machines at once, four groups each (a code-sending system's employers stay in one group: one inbox); it
          # answers an account form's security questions on the desk's card (--security-answers: the owner's call, Oct 14)
          - check: accounts
            slot: accounts-0
            args: --pipeline --test-identity --everywhere --security-answers --parallel 4 --machine 0/3 --fixtures
            minutes: 105
          - check: accounts
            slot: accounts-1
            args: --pipeline --test-identity --everywhere --security-answers --parallel 4 --machine 1/3 --fixtures
            minutes: 105
          - check: accounts
            slot: accounts-2
            args: --pipeline --test-identity --everywhere --security-answers --parallel 4 --machine 2/3 --fixtures
            minutes: 105
    defaults:
      run:
        working-directory: plugins/job-apply/server
    env:
      JOB_APPLY_NEVER_SUBMIT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Is it set up
        id: setup
        env:
          CHECK: ${{ matrix.check }}
          CHECKS: ${{ github.event.inputs.checks }}
          # whether the test identity's secrets are there, never what they are
          HAS_SECRETS: ${{ secrets.LIVE_TEST_EMAIL != '' && secrets.LIVE_TEST_EMAIL_PASSWORD != '' && secrets.LIVE_TEST_SITE_PASSWORD != '' }}
        run: |
          if [ -n "$CHECKS" ] && ! echo ",${CHECKS// /}," | grep -q ",$CHECK,"; then
            echo "Not in this probe's checks ($CHECKS)." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ "$CHECK" = accounts ] && [ "$HAS_SECRETS" != true ]; then
            said="The accounts check is not set up: the repository has no LIVE_TEST_EMAIL, LIVE_TEST_EMAIL_PASSWORD and LIVE_TEST_SITE_PASSWORD secrets yet (see plugins/job-apply/server/scripts/TEST_IDENTITY.md)."
            echo "::notice::$said"
            echo "$said" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v6
        if: steps.setup.outputs.ready == 'true'
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: plugins/job-apply/server/uv.lock
      - if: steps.setup.outputs.ready == 'true'
        run: uv sync --frozen
      - if: steps.setup.outputs.ready == 'true'
        run: uv run --frozen playwright install --with-deps chromium
      - name: Run the check
        id: run
        if: steps.setup.outputs.ready == 'true'
        continue-on-error: true
        timeout-minutes: ${{ matrix.minutes }}
        env:
          CHECK: ${{ matrix.check }}
          SLOT: ${{ matrix.slot || matrix.check }}
          ARGS: ${{ matrix.args }}
          COMPANIES: ${{ github.event.inputs.companies }}
          PLUS: ${{ matrix.check == 'accounts' && github.event.inputs.plus == 'true' && '--plus' || '' }}
          # the test identity's inbox and passwords, for the accounts check only (its inbox's address
          # also for the other checks, at the employers that refuse example.com: live_identity.INBOX_AT):
          # live_smoke.py masks them in everything it prints and writes (and GitHub masks secrets in the log too)
          LIVE_TEST_EMAIL: ${{ secrets.LIVE_TEST_EMAIL }}
          LIVE_TEST_EMAIL_PASSWORD: ${{ matrix.check == 'accounts' && secrets.LIVE_TEST_EMAIL_PASSWORD || '' }}
          LIVE_TEST_SITE_PASSWORD: ${{ matrix.check == 'accounts' && secrets.LIVE_TEST_SITE_PASSWORD || '' }}
        run: |
          set -o pipefail
          mkdir -p "live-$SLOT"
          # (ARGS unquoted: it's the matrix's own list of options)
          uv run --frozen python scripts/live_smoke.py $ARGS $PLUS ${COMPANIES:+--companies "$COMPANIES"} --out "live-$SLOT" 2>&1 \
            | tee "live-$SLOT/run.log"
      - name: Audit what it wrote
        # the rules audit (scripts/live_audit.py): a consent the desk never gives, a submit, or the test identity's
        # secrets, an emailed code or a security answer in a file fail this job, one ::error:: line a finding
        if: steps.setup.outputs.ready == 'true'
        env:
          CHECK: ${{ matrix.check }}
          SLOT: ${{ matrix.slot || matrix.check }}
          LIVE_TEST_EMAIL: ${{ secrets.LIVE_TEST_EMAIL }}
          LIVE_TEST_EMAIL_PASSWORD: ${{ matrix.check == 'accounts' && secrets.LIVE_TEST_EMAIL_PASSWORD || '' }}
          LIVE_TEST_SITE_PASSWORD: ${{ matrix.check == 'accounts' && secrets.LIVE_TEST_SITE_PASSWORD || '' }}
        run: uv run --frozen python scripts/live_audit.py --log "$CHECK=live-$SLOT/run.log" --folder "live-$SLOT"
      - name: Note how it ended
        if: always()
        env:
          SLOT: ${{ matrix.slot || matrix.check }}
          READY: ${{ steps.setup.outputs.ready }}
          OUTCOME: ${{ steps.run.outcome }}
        run: |
          mkdir -p "live-$SLOT"
          # not_set_up: the accounts check without its secrets, which the compare job leaves out
          if [ "$READY" = false ]; then echo not_set_up; else echo "$OUTCOME"; fi > "live-$SLOT/outcome"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-${{ matrix.slot || matrix.check }}
          path: plugins/job-apply/server/live-${{ matrix.slot || matrix.check }}
          retention-days: 7

  compare:
    needs: [fresh, check]
    # (a probe of a few employers or checks isn't compared: the issue keeps the last full run's results)
    if: always() && needs.fresh.outputs.go == 'true' && github.event.inputs.companies == '' && github.event.inputs.checks == '' && github.event.inputs.plus != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/job-apply/server
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_TITLE: Nightly live check
      ISSUE_LABEL: live-check
      # the history's issue: its own title and label (never live-check, which the "fresh" job reads the first one by)
      TREND_TITLE: Nightly live trends
      TREND_LABEL: live-trends
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: plugins/job-apply/server/uv.lock
      - run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: live-*
          path: plugins/job-apply/server  # each check's folder: live-pipeline, live-hr, ...
      - name: Compare with the last run
        id: compare
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p live-compare
          gh issue list --label "$ISSUE_LABEL" --state all --limit 100 \
            --json number,title,state,body > live-compare/issues.json
          # the history so far (none yet, or not to be had: a fresh one starts, and the compare goes on)
          gh issue list --label "$TREND_LABEL" --state all --limit 5 \
            --json number,title,state,body > live-compare/trend-issues.json \
            || echo '[]' > live-compare/trend-issues.json
          args=(--issues live-compare/issues.json --title "$ISSUE_TITLE" --run-url "$RUN_URL"
                --body-out live-compare/body.md --comment-out live-compare/comment.md
                --trend-issues live-compare/trend-issues.json --trend-title "$TREND_TITLE"
                --trend-body-out live-compare/trend.md
                --github-output "$GITHUB_OUTPUT")
          # the accounts check's machines, as one check: their logs one after another; finished only if all did,
          # not set up if none was
          if ls -d live-accounts-* > /dev/null 2>&1; then
            mkdir -p live-accounts
            cat live-accounts-*/run.log > live-accounts/run.log 2>/dev/null || true
            outcomes="$(cat live-accounts-*/outcome 2>/dev/null | sort -u | tr '\n' ' ')"
            case "$outcomes" in
              "success ") echo success ;;
              "not_set_up ") echo not_set_up ;;
              *) echo failure ;;
            esac > live-accounts/outcome
          fi
          unfinished=()
          for check in pipeline hr search accounts; do  # (finance: paused)
            outcome="$(cat "live-$check/outcome" 2>/dev/null)"
            if [ "$outcome" = not_set_up ]; then  # the accounts check, before the owner adds its secrets
              echo "$check: not set up, so not compared"
              continue
            fi
            args+=(--log "$check=live-$check/run.log")
            # a check that didn't finish (or whose machine never reported) keeps its employers' last results
            if [ "$outcome" != success ]; then
              args+=(--partial "$check"); unfinished+=("$check")
            fi
          done
          echo "unfinished=${unfinished[*]}" >> "$GITHUB_OUTPUT"
          uv run --frozen python scripts/live_compare.py "${args[@]}"
          {
            if [ -f live-compare/comment.md ]; then cat live-compare/comment.md; echo; fi
            cat live-compare/body.md
            if [ -f live-compare/trend.md ]; then  # (the history's tables, without its saved block)
              echo; echo "## Trends"; echo; sed '/^<details>/,$d' live-compare/trend.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Questions no common question covers yet
        # (the question bank's coverage, the review of Oct 15: what two employers or more asked the test applicant that
        # data/question_bank.yaml could ask once; a look, never a failure)
        continue-on-error: true
        run: |
          runs=()
          for d in live-pipeline live-hr live-accounts-*; do [ -f "$d/pipeline.json" ] && runs+=("$d"); done
          [ ${#runs[@]} -gt 0 ] || exit 0
          {
            echo "### Questions no common question covers yet (two employers or more)"; echo; echo '```'
            uv run --frozen python scripts/question_bank.py --min 2 "${runs[@]}" | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Update the issue
        if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
        env:
          ISSUE: ${{ steps.compare.outputs.issue }}
          ISSUE_STATE: ${{ steps.compare.outputs.issue_state }}
          CHANGES: ${{ steps.compare.outputs.changes }}
        run: |
          if [ -z "$ISSUE" ]; then  # the first run: the issue, with nothing to compare yet
            gh label create "$ISSUE_LABEL" --color 5319E7 \
              --description "Nightly live check of employers' career sites" 2>/dev/null || true
            gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body-file live-compare/body.md
            exit 0
          fi
          if [ "$CHANGES" != 0 ]; then
            if [ "$ISSUE_STATE" = CLOSED ]; then gh issue reopen "$ISSUE"; fi
            gh issue comment "$ISSUE" --body-file live-compare/comment.md
          fi
          # after the comment: if this fails, the next run reports the change again, not never
          gh issue edit "$ISSUE" --body-file live-compare/body.md
      - name: Update the trend issue
        # (as the issue above: full runs of the default branch only; after it, so the last run's results come first)
        if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
        env:
          TREND_ISSUE: ${{ steps.compare.outputs.trend_issue }}
        run: |
          if [ ! -f live-compare/trend.md ]; then  # (live_compare.py said why in its log)
            echo "No trend body was written: the trend issue stays as it was."
            exit 0
          fi
          if [ -z "$TREND_ISSUE" ]; then  # the first run: the issue, under its own label (made if missing)
            gh label create "$TREND_LABEL" --force --color 0E8A16 \
              --description "The nightly live check's history: counts per run, and the employers that flip"
            gh issue create --title "$TREND_TITLE" --label "$TREND_LABEL" --body-file live-compare/trend.md
            exit 0
          fi
          gh issue edit "$TREND_ISSUE" --body-file live-compare/trend.md
      - name: Say what needs a person
        # (A2, the review of Oct 18: one comment on the issue only when something does: an employer went backwards, a
        # check didn't finish, an employer desk_handled.yaml lists out of "all the way" for two runs, the test inbox
        # refused its login. A quiet night posts nothing. As the issue above: full runs of the default branch only.
        # A digest that fails never turns the run red. At most one a run: the probes' job, below, posts its own only
        # in a run of the probes, which never runs this job: those name their checks, or are the weekly schedule's)
        if: always() && steps.compare.outcome == 'success' && (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch)
        continue-on-error: true
        env:
          ISSUE: ${{ steps.compare.outputs.issue }}
          UNFINISHED: ${{ steps.compare.outputs.unfinished }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          logs=()
          for f in live-*/run.log; do [ -f "$f" ] && logs+=("$f"); done
          uv run --frozen python scripts/nightly_summary.py --digest --body-file live-compare/body.md \
            --comment-file live-compare/comment.md --trend-body live-compare/trend.md --unfinished "$UNFINISHED" \
            --run-url "$RUN_URL" --logs "${logs[@]}" > live-compare/digest.md
          if [ -s live-compare/digest.md ] && [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body-file live-compare/digest.md
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-compare
          path: plugins/job-apply/server/live-compare
          retention-days: 7
      - name: Fail if a check didn't finish
        if: steps.compare.outputs.unfinished != ''
        env:
          UNFINISHED: ${{ steps.compare.outputs.unfinished }}
        run: |
          echo "::error::A check didn't finish ($UNFINISHED); see its job's log"
          exit 1

  # The weekly probes (scripts/live_probes.py): the desk's password reset at two Workday tenants and a tailored resume
  # in the job's folder, as the test identity, never submitting. After this run's checks (never beside the accounts
  # check: one inbox, and the same accounts), and in this workflow's concurrency group (never beside another run).
  probes:
    needs: [fresh, check]
    if: always() && needs.fresh.outputs.probes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: plugins/job-apply/server
    env:
      JOB_APPLY_NEVER_SUBMIT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Is it set up
        id: setup
        env:
          # whether the test identity's secrets are there, never what they are
          HAS_SECRETS: ${{ secrets.LIVE_TEST_EMAIL != '' && secrets.LIVE_TEST_EMAIL_PASSWORD != '' && secrets.LIVE_TEST_SITE_PASSWORD != '' }}
        run: |
          if [ "$HAS_SECRETS" != true ]; then
            said="The weekly probes are not set up: they run as the test identity, and the repository has no LIVE_TEST_EMAIL, LIVE_TEST_EMAIL_PASSWORD and LIVE_TEST_SITE_PASSWORD secrets yet (see plugins/job-apply/server/scripts/TEST_IDENTITY.md)."
            echo "::notice::$said"
            echo "$said" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v6
        if: steps.setup.outputs.ready == 'true'
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: plugins/job-apply/server/uv.lock
      - if: steps.setup.outputs.ready == 'true'
        run: uv sync --frozen
      - if: steps.setup.outputs.ready == 'true'
        run: uv run --frozen playwright install --with-deps chromium
      - name: Run the probes
        id: run
        if: steps.setup.outputs.ready == 'true'
        continue-on-error: true
        # (each of its six runs is stopped at 20 minutes; most take a few)
        timeout-minutes: 140
        env:
          COMPANIES: ${{ github.event.inputs.companies }}
          # live_probes.py and the runs it starts mask them in everything they print and write (and GitHub masks
          # secrets in the log too)
          LIVE_TEST_EMAIL: ${{ secrets.LIVE_TEST_EMAIL }}
          LIVE_TEST_EMAIL_PASSWORD: ${{ secrets.LIVE_TEST_EMAIL_PASSWORD }}
          LIVE_TEST_SITE_PASSWORD: ${{ secrets.LIVE_TEST_SITE_PASSWORD }}
        run: |
          set -o pipefail
          mkdir -p live-probes
          uv run --frozen python scripts/live_probes.py --out live-probes \
            ${COMPANIES:+--companies "$COMPANIES"} 2>&1 \
            | tee live-probes/run.log
      - name: Audit what it wrote
        # (the rules audit, as each check's: a consent the desk never gives, a submit, or the test identity's secrets,
        # an emailed code or a security answer in a file fail this job)
        id: audit
        if: steps.setup.outputs.ready == 'true'
        env:
          LIVE_TEST_EMAIL: ${{ secrets.LIVE_TEST_EMAIL }}
          LIVE_TEST_EMAIL_PASSWORD: ${{ secrets.LIVE_TEST_EMAIL_PASSWORD }}
          LIVE_TEST_SITE_PASSWORD: ${{ secrets.LIVE_TEST_SITE_PASSWORD }}
        run: uv run --frozen python scripts/live_audit.py --log "probes=live-probes/run.log" --folder live-probes
      - name: The probes' results
        if: always() && steps.setup.outputs.ready == 'true'
        run: |
          if [ -f live-probes/report.md ]; then cat live-probes/report.md; else
            echo "The probes wrote no report (see the job's log)."; fi >> "$GITHUB_STEP_SUMMARY"
      - name: Say what needs a person
        # (A2: a desk failure the probes found, or a test inbox that refused its login, as one comment on the nightly
        # issue; nothing when the probes passed. Scheduled runs and the default branch's only; never a probe of a few
        # employers (never written to the issue), and only once the audit found nothing of the test identity's in what
        # the probes wrote. A digest that fails never turns the run red)
        if: always() && steps.setup.outputs.ready == 'true' && steps.audit.outcome == 'success' && github.event.inputs.companies == '' && (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p live-probes
          uv run --frozen python scripts/nightly_summary.py --digest --probes live-probes --logs live-probes/run.log \
            --run-url "$RUN_URL" > live-probes/digest.md
          issue=$(gh issue list --label live-check --state all --limit 100 --json number,title \
            --jq '[.[] | select(.title == "Nightly live check")][0].number // empty')
          if [ -s live-probes/digest.md ] && [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file live-probes/digest.md
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.setup.outputs.ready == 'true'
        with:
          name: live-probes
          path: plugins/job-apply/server/live-probes
          retention-days: 14
      - name: Fail on a desk failure
        # (live_probes.py exits 1 for a desk failure and 2 when it couldn't start; what the site or the person stopped is
        # "couldn't check this week", exit 0. GitHub mails the repository's owner about a failed scheduled run)
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::A weekly probe found a desk failure (or couldn't start): see the run's summary"
          exit 1
