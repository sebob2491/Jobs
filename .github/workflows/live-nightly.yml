name: live-nightly

# Every night, the live check of plugins/job-apply/server/scripts/live_smoke.py (a fake
# profile, submitting disabled), compared with the night before by scripts/live_compare.py:
#   - the Job Desk pipeline on one posting per employer of the default semiconductor list:
#     where it ended ("ready", "needs_you sign_in", "needs_you stuck", ...);
#   - the same for HR jobs on the phoenix-metro list, as an applicant with an HR background,
#     and for finance jobs there, as an applicant with a finance background (paused: the owner's call, Oct
#     10, "put all finance on the back burner"; its last results stay in the issue as they were);
#   - the search check on both lists: whether each employer's search works (how many openings
#     it finds changes daily, and is never compared; the semiconductor list since Oct 16, 2026);
#   - the accounts check: the pipeline as the test identity (a clearly fake applicant with an
#     inbox of its own; the owner's call, Oct 10) at every employer on both lists (--everywhere:
#     the owner's call, Oct 11): it makes their accounts and reads their emailed
#     codes, and never submits. It runs only once the repository has the test identity's three
#     secrets (scripts/TEST_IDENTITY.md); until then it says "not set up" and stays green.
# The issue titled "Nightly live check" (label live-check) holds the last results in its body.
# It gets a comment only when an employer's result changes; on a quiet night only its body's
# "Last checked" line and tables are rewritten, which notifies no one. A run whose check
# didn't finish fails (employers it didn't reach keep their last result).
# Only runs of the default branch write to the issue: a manual run from another branch shows
# its comparison in the job summary only.
# The five checks run at once, each on a machine of its own (a fraction of the time they took
# one after another); the compare job then reads their logs.
# A manual run can be a probe of a few employers or checks (its inputs): it runs only those, and
# isn't compared or written to the issue; its artifacts hold the results
# (scripts/nightly_summary.py --artifacts reads them).

on:
  # GitHub starts this schedule hours late (5 to 10, Oct 2026), so a routine dispatches the run at 3:17 AM in Arizona
  # instead (the owner's call, Oct 13), and a run is dispatched after each release. The schedule stays as a fallback:
  # a scheduled run skips itself when a full run was written to the issue in the last 12 hours (the "fresh" job).
  schedule:
    - cron: "17 10 * * *"  # 3:17 AM in Arizona (UTC-7 all year)
  workflow_dispatch:
    inputs:
      companies:
        description: "Only these employers (comma-separated, as live_smoke.py --companies): a probe, not compared"
        required: false
        default: ""
      checks:
        description: "Only these checks (comma-separated: pipeline, hr, search, accounts): a probe, not compared"
        required: false
        default: ""
      plus:
        description: "The accounts check with the test inbox's own +employer address at each employer (which sites take one): a probe, not compared"
        type: boolean
        required: false
        default: false

concurrency:
  group: live-nightly
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  # A scheduled run that a dispatched full run has already done today's work for (its "Last checked" in the issue
  # within 12 hours) runs nothing: two full runs a day would make the test identity's accounts twice. A dispatched
  # run always goes ahead.
  fresh:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.last.outputs.go }}
    steps:
      - name: When the issue was last written
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != schedule ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          body=$(gh issue list --repo "$REPO" --label live-check --state open --limit 1 --json body --jq '.[0].body' || true)
          last=$(printf '%s' "$body" | sed -n 's/^Last checked: \([0-9-]* [0-9:]*\) UTC.*/\1/p' | head -1)
          if [ -n "$last" ] && [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -lt 43200 ]; then
            echo "A full run was written to the issue at $last UTC, within 12 hours: this late scheduled run skips." >> "$GITHUB_STEP_SUMMARY"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: fresh
    if: needs.fresh.outputs.go == 'true'
    name: ${{ matrix.slot || matrix.check }} check
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.check == 'accounts' && 120 || 60 }}
    strategy:
      fail-fast: false  # each check reports on its own; one that fails leaves its employers' last results
      matrix:
        include:
          - check: pipeline  # the Job Desk pipeline, semiconductor list
            args: --pipeline --fake-passwords --parallel 4 --fixtures
            minutes: 35
          - check: hr  # HR jobs, phoenix-metro list
            args: --pipeline --fake-passwords --parallel 4 --lists phoenix-metro --role hr --fixtures
            minutes: 45
          # finance jobs, phoenix-metro list: paused (the owner's call, Oct 10). To resume, put back:
          # - check: finance
          #   args: --pipeline --fake-passwords --parallel 4 --lists phoenix-metro --role finance
          #   minutes: 30
          - check: search  # whether each employer's search works, on both lists
            args: --lists phoenix-metro,semiconductor-az --parallel 4
            minutes: 30
          # (each application goes as far as the rules let it: up to 5 minutes a round, more rounds and one Resume, the
          # owner's call, Oct 13; the minutes leave room for that)
          # the test identity, its accounts made, at every employer on both lists (the owner's call, Oct 11), on three
          # machines at once, four groups each (a code-sending system's employers stay in one group: one inbox); it
          # answers an account form's security questions on the desk's card (--security-answers: the owner's call, Oct 14)
          - check: accounts
            slot: accounts-0
            args: --pipeline --test-identity --everywhere --security-answers --parallel 4 --machine 0/3 --fixtures
            minutes: 105
          - check: accounts
            slot: accounts-1
            args: --pipeline --test-identity --everywhere --security-answers --parallel 4 --machine 1/3 --fixtures
            minutes: 105
          - check: accounts
            slot: accounts-2
            args: --pipeline --test-identity --everywhere --security-answers --parallel 4 --machine 2/3 --fixtures
            minutes: 105
    defaults:
      run:
        working-directory: plugins/job-apply/server
    env:
      JOB_APPLY_NEVER_SUBMIT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Is it set up
        id: setup
        env:
          CHECK: ${{ matrix.check }}
          CHECKS: ${{ github.event.inputs.checks }}
          # whether the test identity's secrets are there, never what they are
          HAS_SECRETS: ${{ secrets.LIVE_TEST_EMAIL != '' && secrets.LIVE_TEST_EMAIL_PASSWORD != '' && secrets.LIVE_TEST_SITE_PASSWORD != '' }}
        run: |
          if [ -n "$CHECKS" ] && ! echo ",${CHECKS// /}," | grep -q ",$CHECK,"; then
            echo "Not in this probe's checks ($CHECKS)." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ "$CHECK" = accounts ] && [ "$HAS_SECRETS" != true ]; then
            said="The accounts check is not set up: the repository has no LIVE_TEST_EMAIL, LIVE_TEST_EMAIL_PASSWORD and LIVE_TEST_SITE_PASSWORD secrets yet (see plugins/job-apply/server/scripts/TEST_IDENTITY.md)."
            echo "::notice::$said"
            echo "$said" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v6
        if: steps.setup.outputs.ready == 'true'
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: plugins/job-apply/server/uv.lock
      - if: steps.setup.outputs.ready == 'true'
        run: uv sync --frozen
      - if: steps.setup.outputs.ready == 'true'
        run: uv run --frozen playwright install --with-deps chromium
      - name: Run the check
        id: run
        if: steps.setup.outputs.ready == 'true'
        continue-on-error: true
        timeout-minutes: ${{ matrix.minutes }}
        env:
          CHECK: ${{ matrix.check }}
          SLOT: ${{ matrix.slot || matrix.check }}
          ARGS: ${{ matrix.args }}
          COMPANIES: ${{ github.event.inputs.companies }}
          PLUS: ${{ matrix.check == 'accounts' && github.event.inputs.plus == 'true' && '--plus' || '' }}
          # the test identity's inbox and passwords, for the accounts check only (its inbox's address
          # also for the other checks, at the employers that refuse example.com: live_identity.INBOX_AT):
          # live_smoke.py masks them in everything it prints and writes (and GitHub masks secrets in the log too)
          LIVE_TEST_EMAIL: ${{ secrets.LIVE_TEST_EMAIL }}
          LIVE_TEST_EMAIL_PASSWORD: ${{ matrix.check == 'accounts' && secrets.LIVE_TEST_EMAIL_PASSWORD || '' }}
          LIVE_TEST_SITE_PASSWORD: ${{ matrix.check == 'accounts' && secrets.LIVE_TEST_SITE_PASSWORD || '' }}
        run: |
          set -o pipefail
          mkdir -p "live-$SLOT"
          # (ARGS unquoted: it's the matrix's own list of options)
          uv run --frozen python scripts/live_smoke.py $ARGS $PLUS ${COMPANIES:+--companies "$COMPANIES"} --out "live-$SLOT" 2>&1 \
            | tee "live-$SLOT/run.log"
      - name: Note how it ended
        if: always()
        env:
          SLOT: ${{ matrix.slot || matrix.check }}
          READY: ${{ steps.setup.outputs.ready }}
          OUTCOME: ${{ steps.run.outcome }}
        run: |
          mkdir -p "live-$SLOT"
          # not_set_up: the accounts check without its secrets, which the compare job leaves out
          if [ "$READY" = false ]; then echo not_set_up; else echo "$OUTCOME"; fi > "live-$SLOT/outcome"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-${{ matrix.slot || matrix.check }}
          path: plugins/job-apply/server/live-${{ matrix.slot || matrix.check }}
          retention-days: 7

  compare:
    needs: [fresh, check]
    # (a probe of a few employers or checks isn't compared: the issue keeps the last full run's results)
    if: always() && needs.fresh.outputs.go == 'true' && github.event.inputs.companies == '' && github.event.inputs.checks == '' && github.event.inputs.plus != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/job-apply/server
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_TITLE: Nightly live check
      ISSUE_LABEL: live-check
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: plugins/job-apply/server/uv.lock
      - run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: live-*
          path: plugins/job-apply/server  # each check's folder: live-pipeline, live-hr, ...
      - name: Compare with the last run
        id: compare
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p live-compare
          gh issue list --label "$ISSUE_LABEL" --state all --limit 100 \
            --json number,title,state,body > live-compare/issues.json
          args=(--issues live-compare/issues.json --title "$ISSUE_TITLE" --run-url "$RUN_URL"
                --body-out live-compare/body.md --comment-out live-compare/comment.md
                --github-output "$GITHUB_OUTPUT")
          # the accounts check's machines, as one check: their logs one after another; finished only if all did,
          # not set up if none was
          if ls -d live-accounts-* > /dev/null 2>&1; then
            mkdir -p live-accounts
            cat live-accounts-*/run.log > live-accounts/run.log 2>/dev/null || true
            outcomes="$(cat live-accounts-*/outcome 2>/dev/null | sort -u | tr '\n' ' ')"
            case "$outcomes" in
              "success ") echo success ;;
              "not_set_up ") echo not_set_up ;;
              *) echo failure ;;
            esac > live-accounts/outcome
          fi
          unfinished=()
          for check in pipeline hr search accounts; do  # (finance: paused)
            outcome="$(cat "live-$check/outcome" 2>/dev/null)"
            if [ "$outcome" = not_set_up ]; then  # the accounts check, before the owner adds its secrets
              echo "$check: not set up, so not compared"
              continue
            fi
            args+=(--log "$check=live-$check/run.log")
            # a check that didn't finish (or whose machine never reported) keeps its employers' last results
            if [ "$outcome" != success ]; then
              args+=(--partial "$check"); unfinished+=("$check")
            fi
          done
          echo "unfinished=${unfinished[*]}" >> "$GITHUB_OUTPUT"
          uv run --frozen python scripts/live_compare.py "${args[@]}"
          {
            if [ -f live-compare/comment.md ]; then cat live-compare/comment.md; echo; fi
            cat live-compare/body.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Update the issue
        if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
        env:
          ISSUE: ${{ steps.compare.outputs.issue }}
          ISSUE_STATE: ${{ steps.compare.outputs.issue_state }}
          CHANGES: ${{ steps.compare.outputs.changes }}
        run: |
          if [ -z "$ISSUE" ]; then  # the first run: the issue, with nothing to compare yet
            gh label create "$ISSUE_LABEL" --color 5319E7 \
              --description "Nightly live check of employers' career sites" 2>/dev/null || true
            gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body-file live-compare/body.md
            exit 0
          fi
          if [ "$CHANGES" != 0 ]; then
            if [ "$ISSUE_STATE" = CLOSED ]; then gh issue reopen "$ISSUE"; fi
            gh issue comment "$ISSUE" --body-file live-compare/comment.md
          fi
          # after the comment: if this fails, the next run reports the change again, not never
          gh issue edit "$ISSUE" --body-file live-compare/body.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-compare
          path: plugins/job-apply/server/live-compare
          retention-days: 7
      - name: Fail if a check didn't finish
        if: steps.compare.outputs.unfinished != ''
        env:
          UNFINISHED: ${{ steps.compare.outputs.unfinished }}
        run: |
          echo "::error::A check didn't finish ($UNFINISHED); see its job's log"
          exit 1
